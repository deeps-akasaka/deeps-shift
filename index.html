<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>出勤UI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="出勤UI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1c1e">
<style>
  /* iPhone 標準アプリ（カレンダー）のダークモード風。色は「青」ひとつだけ（選んだもの・新しい値・保存） */
  :root {
    --bg: #1c1c1e; --card: #2c2c2e; --pill: #3a3a3c; --sep: #3a3a3c;
    --ink: #ffffff; --sub: #98989d; --faint: #636366; --accent: #0a84ff; --seg-on: #636366; --danger: #ff453a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); height: 100%; overflow: hidden; }
  body { color: var(--ink); font-family: -apple-system, "SF Pro Text", "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
  button { font-family: inherit; color: var(--ink); touch-action: manipulation; border: 0; }
  [hidden] { display: none !important; }

  /* 1画面：上／中（残りの高さ）／下。下に3つのタブ（今日・月・入力） */
  .app { max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); }
  .page { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .top { padding: calc(10px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 10px; }
  .top h1 { margin: 0; font-size: 22px; font-weight: 700; flex: 1; }
  .gear { width: 40px; height: 40px; border-radius: 50%; background: var(--card); display: grid; place-items: center; flex: none; padding: 0; }
  .gear svg { width: 22px; height: 22px; fill: none; stroke: #d1d1d6; stroke-width: 1.8; }
  .seg { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { background: transparent; padding: 8px 0; font-size: 14px; border-radius: 9px; }
  .seg button.on { background: var(--seg-on); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  .nav { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
  .nav b { font-size: 22px; font-weight: 700; white-space: nowrap; }
  .nav button { background: transparent; color: var(--sub); font-size: 26px; padding: 0 10px; line-height: 1; }
  .nav small { font-size: 12px; color: var(--sub); background: var(--card); padding: 4px 10px; border-radius: 999px; margin-left: 6px; white-space: nowrap; }
  .notice { font-size: 12px; color: var(--sub); text-align: center; margin: 0 14px 6px; }
  .mini { font-size: 12px; padding: 4px 12px; border-radius: 999px; background: var(--accent); margin-left: 6px; }
  .mini:disabled { background: var(--pill); color: var(--faint); }

  .tabbar { display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: #232325; border-top: 1px solid #38383a; }
  .tabbar button { background: transparent; font-size: 11px; color: var(--sub); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0; }
  .tabbar button.on { color: var(--accent); }
  .tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; }

  /* 日付の行（入力） */
  .days { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); background: var(--card); border-radius: 16px; }
  .day { position: relative; display: flex; align-items: center; padding: 0 12px 0 14px; min-height: 44px; cursor: pointer; }
  .day + .day::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 1px solid var(--sep); }
  .day .box { width: 22px; height: 22px; border: 2px solid var(--faint); border-radius: 50%; margin-right: 10px; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
  .day.sel .box { background: var(--accent); border-color: var(--accent); }
  .day .d { width: 76px; font-size: 16px; flex: none; }
  .day .d small { color: var(--sub); font-size: 12px; margin-left: 3px; font-variant-numeric: tabular-nums; }
  .day.past .d { color: var(--sub); }
  .day .vals { margin-left: auto; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .day .pill { font-size: 15px; padding: 4px 11px; border-radius: 999px; background: var(--pill); min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day .pill.empty { background: transparent; color: var(--faint); }
  .day .pill.was { background: transparent; color: var(--sub); text-decoration: line-through; padding-right: 0; }
  .day .pill.new { background: var(--accent); font-weight: 700; flex: none; }
  .day .arrow { color: var(--faint); font-size: 12px; flex: none; }
  .day .vals.ents { flex-wrap: wrap; justify-content: flex-end; gap: 6px; padding: 6px 0; }
  .day .pill.ent.del { background: var(--danger); font-weight: 700; }
  .day.off { opacity: .45; cursor: default; }
  .day.off .box { border-style: dotted; }
  .day.off .pill { background: transparent; font-size: 12px; }

  /* 人（日付と時間の間）：名前を左右に流して選ぶ。「＋」は右に固定 */
  .who { margin: 8px 0 0; padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); display: flex; gap: 6px; align-items: center; }
  .lab { width: 40px; flex: none; font-size: 12px; color: var(--sub); line-height: 1.2; }
  .whoscroll { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .whoscroll::-webkit-scrollbar { display: none; }
  .nm { flex: none; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--pill); font-size: 15px; white-space: nowrap; }
  .nm.on { background: var(--accent); font-weight: 700; }
  .nm.tai { background: transparent; border: 1px dashed var(--faint); color: var(--sub); }
  .nm.tai.on { border-style: solid; background: var(--accent); color: #fff; border-color: var(--accent); }
  .nm.plus { background: transparent; border: 1px solid var(--faint); width: 44px; padding: 0; font-size: 20px; flex: none; }

  /* 下：入り・上がり・保存 */
  .dock { padding: 8px max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left)); }
  .grp { display: flex; gap: 8px; margin-bottom: 6px; }
  .grp .lab { padding-top: 11px; }
  .chips { flex: 1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; min-width: 0; }
  .chip { height: 36px; border-radius: 999px; background: var(--pill); font-size: 16px; font-variant-numeric: tabular-nums; padding: 0; }
  .chip.dim { color: var(--sub); }
  .chip.on { background: var(--accent); font-weight: 700; }
  .chip.act { background: transparent; border: 1px solid var(--faint); font-size: 13px; }
  .chip.act.on { background: var(--accent); border-color: var(--accent); }
  .taiopt { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
  .taiopt .sw { display: flex; align-items: center; gap: 10px; font-size: 15px; flex: none; }
  .taiopt .chip { flex: 1; }
  .switch { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 999px; background: #48484a; position: relative; transition: background .2s; margin: 0; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { left: 22px; }
  .savebar { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
  .preview { flex: 1; font-size: 12.5px; line-height: 1.45; color: var(--sub); min-width: 0; min-height: 36px; display: flex; align-items: center; }
  .preview > div { min-width: 0; }
  .preview b { color: var(--ink); font-weight: 600; }
  .preview .ow { color: var(--ink); }
  .preview .ow::before { content: "↻ "; color: var(--sub); }
  .preview .bad { color: var(--danger); }
  .save { flex: none; width: 124px; height: 46px; border-radius: 999px; background: var(--accent); font-size: 16px; font-weight: 700; }
  .save.danger { background: var(--danger); }
  .save:disabled { background: var(--pill); color: var(--faint); }
  @media (max-height: 700px) { .chip { height: 32px; } .day { min-height: 40px; } .save { height: 42px; } .top { padding-top: calc(6px + env(safe-area-inset-top)); } .nm { height: 30px; } .grp .lab { padding-top: 8px; } }

  /* 今日 */
  .sum { margin: 0 max(14px, env(safe-area-inset-left)) 8px; font-size: 13px; color: var(--sub); }
  .sum b { color: var(--ink); font-size: 15px; }
  .list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); background: var(--card); border-radius: 16px; }
  .row { position: relative; display: flex; align-items: center; min-height: 50px; padding: 0 14px; font-size: 17px; cursor: pointer; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 1px solid var(--sep); }
  .row .t { margin-left: auto; font-size: 16px; font-variant-numeric: tabular-nums; background: var(--pill); padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
  .row.tai .n { color: var(--sub); }
  .empty { padding: 28px 16px; text-align: center; color: var(--sub); font-size: 14px; }
  /* 閲覧専用（?view=鍵）：入力・設定に関わるものを隠す */
  .view .gear, .view .hint { display: none; }
  .view .tabbar { grid-template-columns: repeat(2, 1fr); }
  .view .row, .view .mwrap td { cursor: default; }
  .hint { text-align: center; color: var(--faint); font-size: 12px; padding: 8px 0 10px; }

  /* 月（案A：全員×日付。名前の列と日付の行は固定） */
  .mwrap { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; margin: 0 0 0 max(14px, env(safe-area-inset-left)); background: var(--card); border-radius: 16px 0 0 16px; }
  .mwrap table { border-collapse: separate; border-spacing: 0; }
  .mwrap th, .mwrap td { height: 34px; width: 50px; min-width: 50px; text-align: center; font-size: 11.5px; border-top: 1px solid var(--sep); border-right: 1px solid #333335; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 400; padding: 0; }
  .mwrap th { position: sticky; top: 0; background: var(--card); height: 46px; z-index: 2; font-size: 13px; line-height: 1.2; border-top: 0; }
  .mwrap th small { display: block; font-size: 10.5px; color: var(--sub); }
  .mwrap .n { position: sticky; left: 0; width: 64px; min-width: 64px; text-align: left; padding-left: 10px; font-size: 14px; background: var(--card); z-index: 1; font-weight: 600; }
  .mwrap th.n { z-index: 3; color: var(--sub); font-size: 12px; font-weight: 400; }
  .mwrap td.n.t { color: var(--sub); font-weight: 400; }
  .mwrap .today { background: rgba(10,132,255,.18); }
  .mwrap th.today { color: #6cb2ff; background: #1f3350; }
  .mwrap .sun { background: #252527; color: var(--faint); }
  .mwrap th.sun .dn { color: var(--danger); }          /* 日曜は、日にちだけ赤 */
  .mwrap th.wed, .mwrap th.wed small { color: #7cc4ff; }   /* 水曜は、日にちと曜日の文字だけ薄い水色（列は塗らない） */
  .mwrap td { cursor: pointer; }

  .hol { color: var(--danger); font-size: 10.5px; font-weight: 600; margin-left: 3px; border: 1px solid currentColor; border-radius: 4px; padding: 0 3px; line-height: 1.3; display: inline-block; }
  .mwrap th small .hol { margin-left: 2px; }
  .sum .hol { font-size: 11px; }

  /* 設定 */
  .back { background: transparent; color: var(--accent); font-size: 17px; padding: 6px 0; }
  .sec { margin: 6px max(14px, env(safe-area-inset-left)) 0; font-size: 12px; color: var(--sub); padding-left: 6px; }
  .add { margin: 8px max(14px, env(safe-area-inset-left)) 8px; height: 46px; border-radius: 14px; background: var(--card); color: var(--accent); font-size: 16px; font-weight: 600; }
  .pl { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); background: var(--card); border-radius: 16px; }
  .pr { position: relative; display: flex; align-items: center; min-height: 44px; padding: 0 14px; font-size: 16px; }
  .pr + .pr::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 1px solid var(--sep); }
  .pr span { margin-left: auto; display: flex; gap: 6px; }
  .pr button { background: transparent; color: var(--accent); font-size: 14px; padding: 10px 8px; }
  .pr button.d { color: var(--danger); }
  .misc { margin: 12px max(14px, env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); background: var(--card); border-radius: 16px; }
  .misc button { display: block; width: 100%; text-align: left; background: transparent; padding: 14px 16px; font-size: 16px; }
  .misc button + button { border-top: 1px solid var(--sep); }
  .misc button.r { color: var(--danger); }
  .misc small { color: var(--sub); font-size: 12px; margin-left: 8px; }

  .toast { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: var(--pill); font-size: 14px; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }
  .toast.pend { background: var(--accent); }

  /* ログイン */
  .login { max-width: 480px; margin: 0 auto; padding: calc(80px + env(safe-area-inset-top)) 24px 40px; }
  .login h1 { font-size: 30px; margin: 0 0 6px; }
  .login p { color: var(--sub); margin: 0 0 28px; font-size: 14px; }
  .login input { width: 100%; font-size: 22px; padding: 16px 18px; border-radius: 16px; border: 0; background: var(--card); color: var(--ink); letter-spacing: .3em; outline: none; }
  .login .msg { min-height: 22px; margin: 12px 4px 0; font-size: 14px; color: var(--danger); }
  .login .go { width: 100%; margin-top: 12px; font-size: 17px; font-weight: 700; padding: 17px; border: 0; border-radius: 999px; background: var(--accent); }
  .login .go:disabled { background: var(--pill); color: var(--faint); }

  /* 下から出るダイアログ */
  .veil { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; }
  .sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; background: var(--card); border-radius: 26px 26px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); z-index: 21; }
  .sheet h2 { font-size: 18px; margin: 0 0 8px; }
  .sheet p { margin: 0 0 14px; color: var(--sub); font-size: 14px; line-height: 1.6; }
  .sheet p b { color: var(--ink); }
  .sheet ul { list-style: none; padding: 0; margin: 0 0 16px; }
  .sheet li { padding: 10px 0; border-top: 1px solid var(--sep); font-size: 15px; font-variant-numeric: tabular-nums; }
  .sheet li s { color: var(--sub); }
  .sheet .txt { width: 100%; font-size: 17px; padding: 14px 16px; border-radius: 14px; border: 0; background: var(--pill); color: var(--ink); outline: none; }
  .sheet .msg { min-height: 20px; margin: 8px 4px 6px; font-size: 13px; color: var(--danger); }
  .sheet .btns { display: grid; gap: 10px; }
  .sheet .btns button { font-size: 16px; padding: 15px; border-radius: 16px; background: var(--pill); }
  .sheet .btns button.main { background: var(--accent); font-weight: 700; }
  .sheet .btns button.danger { color: var(--danger); }
  .sheet .btns button.dn { background: var(--danger); font-weight: 700; }
</style>
</head>
<body>

<div class="login" id="loginView" hidden>
  <h1>出勤UI</h1>
  <p>PIN を入力してください</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="16" aria-label="PIN">
  <div class="msg" id="loginMsg"></div>
  <button class="go" id="loginBtn">ログイン</button>
</div>

<div class="app" id="appView" hidden>

  <!-- 入力 -->
  <div class="page" id="pgInput">
    <div class="top">
      <div class="seg" id="seg"><button data-w="0">今週</button><button data-w="1">来週</button><button data-w="2">再来週</button></div>
      <button class="gear" data-gear aria-label="設定"></button>
    </div>
    <p class="notice" id="notice" hidden><span id="noticeText"></span> <button class="mini" id="mkBtn">作る</button></p>
    <div class="days" id="days"></div>
    <div class="who"><span class="lab">人</span><div class="whoscroll" id="who"></div><button class="nm plus" id="addBtn" aria-label="キャストを追加">＋</button></div>
    <div class="dock">
      <div class="grp" id="inGrp"><span class="lab">入り</span><div class="chips" id="inChips"></div></div>
      <div class="grp" id="outGrp"><span class="lab">上がり</span><div class="chips" id="outChips"></div></div>
      <div class="grp" id="taiGrp" hidden>
        <span class="lab" id="retaiLab">再体</span>
        <div class="taiopt">
          <span class="sw" id="retaiSw"><input type="checkbox" class="switch" id="retai" aria-label="再体（再度体入）"></span>
          <button class="chip act" id="clear">体入を消す</button>
        </div>
      </div>
      <div class="savebar"><div class="preview" id="preview"></div><button class="save" id="save">保存</button></div>
    </div>
  </div>

  <!-- 今日 -->
  <div class="page" id="pgToday" hidden>
    <div class="top">
      <div class="nav"><button id="tPrev" aria-label="前の日">‹</button><b id="tTitle"></b><button id="tNext" aria-label="次の日">›</button><small id="tBiz" hidden>営業日</small></div>
      <button class="gear" data-gear aria-label="設定"></button>
    </div>
    <div class="sum" id="tSum"></div>
    <div class="list" id="tList"></div>
    <div class="hint">名前をタップすると、その人とその日で入力が開きます</div>
  </div>

  <!-- 月 -->
  <div class="page" id="pgMonth" hidden>
    <div class="top">
      <div class="nav"><button id="mPrev" aria-label="前の月">‹</button><b id="mTitle"></b><button id="mNext" aria-label="次の月">›</button></div>
      <button class="gear" data-gear aria-label="設定"></button>
    </div>
    <div class="mwrap" id="mWrap"></div>
    <div class="hint" id="mHint">セルをタップすると、その人とその日で入力が開きます</div>
  </div>

  <!-- 設定 -->
  <div class="page" id="pgSettings" hidden>
    <div class="top"><button class="back" id="sBack">‹ 戻る</button><h1 style="text-align:center;padding-right:48px">設定</h1></div>
    <div class="sec" id="sCount"></div>
    <button class="add" id="sAdd">＋ キャストを追加</button>
    <div class="pl" id="sList"></div>
    <div class="misc"><button id="sMake">来月のシートを作る<small>今月の次の月</small></button><button id="sReload">最新の状態に更新<small id="sSync"></small></button><button class="r" id="sLogout">ログアウト（合言葉を消す）</button></div>
  </div>

  <div class="tabbar" id="tabbar">
    <button data-tab="today"></button><button data-tab="month"></button><button data-tab="input"></button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="toast pend" id="pend">保存中 …</div>
<div id="dlgRoot"></div>

<script>
(function () {
  'use strict';

  // ---- 設定 ---------------------------------------------------------------
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbwTXHJyn-snXYxaDFA_oswrmNWJrm4wVedPw1gd25jqaKkZ6zLM-0rf8BzirZEujw/exec';
  var SHEET_SUFFIX = '';           // 月のシートの名前は「26/10」の形（年/月だけ）
  var TOKEN_KEY = 'shift-token';
  var PERSON_KEY = 'shift-person';
  var WD = ['月', '火', '水', '木', '金', '土', '日'];
  var IN_VALS = ['8', '8.5', '9', '9.5', '10', '10.5', '11', '11.5', '12'];
  var OUT_VALS = ['11', '11.5', '12', '12.5', '1', '1.5', '2', 'L'];
  var MARU = '〇';               // 表と同じ「〇」（U+3007）

  var qs = new URLSearchParams(location.search);
  var VIEW = qs.get('view') || '';   // 閲覧専用のリンク（?view=鍵）。PINなしで、今日・月を見るだけ
  var MOCK = qs.has('mock');      // 開発用：偽の窓口で動かす（本番では使わない）

  // ---- 小さな道具 -----------------------------------------------------------
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },

  var toastTimer = null;
  function toast(msg) {

  // ---- 日付（営業日は、午前7時で切り替わる） ---------------------------------------
  function jstParts(ms) {

    return { y: +a[0], m: +a[1], d: +a[2] };
  }
  function businessToday() {
    var o = qs.get('today');                       // 開発用：?today=2026-10-29

  function addDays(p, n) {

  function cmpDate(a, b) { return (a.y - b.y) || (a.m - b.m) || (a.d - b.d); }
  function sheetName(y, m) { return String(y).slice(-2) + '/' + (m < 10 ? '0' : '') + m + SHEET_SUFFIX; }

  // ---- 祝日（日本の国民の祝日）。計算で出す。内閣府の一覧（2021〜2027年）と、dev/test.html で照合している -----
  var holidayCache = {};
  function nthMonday(y, m, n) { var first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(); return 1 + ((1 - first + 7) % 7) + 7 * (n - 1); }
  function holidaysOf(y) {                         // { m*100+d: 名前 }
    if (holidayCache[y]) return holidayCache[y];
    var h = {};
    function add(m, d, name) { h[m * 100 + d] = name; }
    var ys = y - 1980, sp = Math.floor(20.8431 + 0.242194 * ys - Math.floor(ys / 4)), au = Math.floor(23.2488 + 0.242194 * ys - Math.floor(ys / 4));
    add(1, 1, '元日');
    if (y >= 2000) add(1, nthMonday(y, 1, 2), '成人の日'); else add(1, 15, '成人の日');
    if (y >= 1967) add(2, 11, '建国記念の日');
    if (y >= 2020) add(2, 23, '天皇誕生日'); else if (y >= 1989 && y <= 2018) add(12, 23, '天皇誕生日');
    add(3, sp, '春分の日');

    add(5, 3, '憲法記念日');
    if (y >= 2007) add(5, 4, 'みどりの日');
    add(5, 5, 'こどもの日');
    if (y === 2020) add(7, 23, '海の日'); else if (y === 2021) add(7, 22, '海の日'); else if (y >= 2003) add(7, nthMonday(y, 7, 3), '海の日');
    if (y === 2020) add(8, 10, '山の日'); else if (y === 2021) add(8, 8, '山の日'); else if (y >= 2016) add(8, 11, '山の日');
    if (y >= 2003) add(9, nthMonday(y, 9, 3), '敬老の日');
    add(9, au, '秋分の日');
    if (y === 2020) add(7, 24, 'スポーツの日'); else if (y === 2021) add(7, 23, 'スポーツの日'); else if (y >= 2020) add(10, nthMonday(y, 10, 2), 'スポーツの日');
    else if (y >= 2000) add(10, nthMonday(y, 10, 2), '体育の日'); else add(10, 10, '体育の日');
    add(11, 3, '文化の日');
    add(11, 23, '勤労感謝の日');
    if (y >= 2007) {
      var dow = function (m, d) { return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
      Object.keys(h).map(Number).sort(function (a, b) { return a - b; }).forEach(function (k) {   // 日曜の祝日は、次の祝日でない日が「休日」（振替）
        var m = Math.floor(k / 100), d = k % 100;
        if (dow(m, d) !== 0) return;
        var t = new Date(Date.UTC(y, m - 1, d + 1));
        while (h[(t.getUTCMonth() + 1) * 100 + t.getUTCDate()]) t = new Date(t.getTime() + 86400000);
        h[(t.getUTCMonth() + 1) * 100 + t.getUTCDate()] = '休日';
      });
      for (var dd = new Date(Date.UTC(y, 0, 2)); dd.getUTCFullYear() === y; dd = new Date(dd.getTime() + 86400000)) {   // 祝日にはさまれた平日は「休日」
        var kk = (dd.getUTCMonth() + 1) * 100 + dd.getUTCDate(), pv = new Date(dd.getTime() - 86400000), nx = new Date(dd.getTime() + 86400000);
        if (h[kk] || dd.getUTCDay() === 0) continue;
        if (h[(pv.getUTCMonth() + 1) * 100 + pv.getUTCDate()] && nx.getUTCFullYear() === y && h[(nx.getUTCMonth() + 1) * 100 + nx.getUTCDate()]) h[kk] = '休日';
      }

    return holidayCache[y] = h;
  }
  function holidayName(p) { return holidaysOf(p.y)[p.m * 100 + p.d] || ''; }

  // ---- 状態 -----------------------------------------------------------------
  var S = {
    token: null, today: null, week: 1, person: null, tai: false,
    tab: 'input', settings: false,   // 開いているタブ（today / month / input）と、設定画面
    tDay: null, mMonth: null,        // 今日タブの日付、月タブの月
    whoKey: '', mKey: '',

    months: {},                 // シート名 → { status, people, taiRows, cells, rowByName, days }
    sel: {},                    // 選んだ日（0〜6）
    draft: {},                  // 日ごとの下書き（0〜6）→ { i, o, maru, clear, retai }
    taiDel: {},                 // 体入の「消すもの」（'日の番号:行'）
    delMode: false,             // 体入を消すモード
    inflight: 0, queue: Promise.resolve(), abort: false, failMsg: '', pendingConflict: null,   // 保存の待ち行列
    lastApi: 0, lastSync: 0, hiddenAt: 0
  };

  function weekDays(w) {
    var base = addDays(S.today, -weekdayIdx(S.today) + 7 * w);
    var out = [];
    for (var i = 0; i < 7; i++) {
      var p = addDays(base, i);
      out.push({ idx: i, y: p.y, m: p.m, d: p.d, key: sheetName(p.y, p.m), closed: i === 6, past: cmpDate(p, S.today) < 0, hol: holidayName(p) });
    }
    return out;
  }
  function cell(mo, row, day) { var r = mo.cells[row]; return (r && r[day]) || ''; }

  // ---- 窓口（GAS）を呼ぶ ----------------------------------------------------------
  function api(body) {
    S.lastApi = Date.now();
    if (MOCK && window.MOCK_API) return window.MOCK_API(body);
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 30000);
    return fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // application/json は、ブラウザの事前確認が通らない
      body: JSON.stringify(body),
      signal: ctl.signal
    }).then(function (r) { clearTimeout(timer); return r.json(); }, function (e) { clearTimeout(timer); throw e; });
  }

  function loadMonth(key, silent) {
    var mo = S.months[key] = S.months[key] || { status: 'loading' };
    if (!silent || mo.status !== 'ok') mo.status = 'loading';
    render();
    return api(VIEW ? { api: 'getMonth', view: VIEW, sheet: key } : { api: 'getMonth', token: S.token, sheet: key }).then(function (r) {
      if (r.error === 'auth' && VIEW) { mo.checkedAt = Date.now(); mo.status = 'error'; toast('このリンクは使えません。新しいリンクをもらってください'); return; }
      if (r.error === 'auth') { logout('ログインの期限が切れました。もう一度ログインしてください'); return; }
      mo.checkedAt = Date.now();
      if (!r.ok) { mo.status = (r.error === 'nosheet') ? 'none' : 'error'; return; }
      mo.status = 'ok'; mo.people = r.people; mo.taiRows = r.taiRows; mo.cells = r.cells; mo.days = r.days;
      mo.rowByName = {}; r.people.forEach(function (p) { mo.rowByName[p.name] = p.row; });
      S.lastSync = Date.now();
    }).catch(function () { mo.checkedAt = Date.now(); if (mo.status !== 'ok') mo.status = 'error'; if (silent) toast('更新できませんでした'); });
  }
  function loadWeek(w, silent) {
    var seen = {};
    return Promise.all(weekDays(w).filter(function (d) { if (seen[d.key]) return false; seen[d.key] = 1; return true; }).map(function (d) {
      var mo = S.months[d.key];
      if (!silent && mo && (mo.status === 'ok' || (mo.status === 'none' && Date.now() - mo.checkedAt < 20000))) return null;
      return loadMonth(d.key, silent);
    })).then(ensurePerson).then(render);
  }
  // 今日・月タブ用：まだ読んでいないシートを読む（描画のたびに呼ぶので、読み込み中・直近の失敗は、もう一度読まない）
  function need(key) {
    var mo = S.months[key];
    if (mo && (mo.status === 'ok' || mo.status === 'loading' || ((mo.status === 'none' || mo.status === 'error') && Date.now() - mo.checkedAt < 20000))) return;
    loadMonth(key).then(render);
  }
  function refreshAll() {
    var keys = Object.keys(S.months).filter(function (k) { return S.months[k].status === 'ok' || S.months[k].status === 'none'; });
    return Promise.all(keys.map(function (k) { return loadMonth(k, true); })).then(function () { ensurePerson(); render(); });
  }

  // ---- 人 -------------------------------------------------------------------
  function peopleList() {
    var list = null;
    weekDays(S.week).forEach(function (d) { var mo = S.months[d.key]; if (!list && mo && mo.status === 'ok') list = mo.people; });
    if (!list) Object.keys(S.months).forEach(function (k) { var mo = S.months[k]; if (!list && mo.status === 'ok') list = mo.people; });
    return (list || []).map(function (p) { return p.name; });
  }
  function ensurePerson() {
    var list = peopleList();
    if (S.person && list.indexOf(S.person) >= 0) return;
    var saved = store.get(PERSON_KEY);
    S.person = (saved && list.indexOf(saved) >= 0) ? saved : (list[0] || null);
  }

  // ---- 日ごとの今の値 ---------------------------------------------------------------
  function dayInfo(day) {
    var info = { day: day, cur: '', usable: false, note: '', row: 0 };
    if (day.closed) { info.note = '定休日'; return info; }
    var mo = S.months[day.key];
    if (!mo || mo.status === 'loading') { info.note = '読み込み中'; return info; }
    if (mo.status === 'none') { info.note = 'シートなし'; return info; }
    if (mo.status === 'error') { info.note = '読めません'; return info; }
    if (mo.days.indexOf(day.d) < 0) { info.note = '日付なし'; return info; }
    if (S.tai) {
      if (!mo.taiRows.length) { info.note = '体入の枠なし'; return info; }
      info.entries = mo.taiRows.map(function (r) { return { row: r, v: cell(mo, r, day.d) }; }).filter(function (e) { return e.v; });
      info.cur = info.entries.map(function (e) { return e.v; }).join(' / ');
      info.usable = true;
    } else {
      var row = mo.rowByName[S.person];
      if (!row) { info.note = '名前なし'; return info; }
      info.row = row; info.cur = cell(mo, row, day.d); info.usable = true;
    }
    return info;
  }

  // ---- 下書き（日ごと） ---------------------------------------------------------------
  // S.draft[日の番号] = { i, o, maru, clear, retai }。i・o は null＝まだ選んでいない、''＝「空」を選んだ
  function val(d) {                                  // その日の書き込む値（null＝空にする、undefined＝まだ決まっていない）
    if (!d) return undefined;
    if (S.tai) return d.i ? ((d.retai ? '再体 ' : '') + d.i) : undefined;
    if (d.clear) return null;
    if (d.maru) return MARU;
    var i = d.i, o = d.o;
    if (!i && !o) return undefined;
    if (i && !o) return i;                           // 入りだけ（ハイフンなし）
    if (!i && o) return '-' + o;                     // 上がりだけ
    return i + '-' + o;
  }
  function isEmptyDraft(d) { return d.i == null && d.o == null && !d.maru && !d.clear && !d.retai; }
  function selDays() {                               // 選んでいて、使える日
    return weekDays(S.week).filter(function (day) { return S.sel[day.idx] && dayInfo(day).usable; });
  }
  function selDrafts() { return selDays().map(function (day) { return S.draft[day.idx] || {}; }); }
  function shared(key) {                             // 選んだ日が全部同じ値のときだけ、その値（違えば undefined）
    var ds = selDrafts(); if (!ds.length) return undefined;

    return v;
  }
  function allFlag(key) { var ds = selDrafts(); return ds.length > 0 && ds.every(function (d) { return !!d[key]; }); }
  function apply(fn) {                               // 選んでいる日だけに、下書きを入れる
    var days = selDays();
    if (!days.length) { toast('日付を選んでください'); return; }
    if (Date.now() - S.lastApi > 40000) api(VIEW ? { api: 'ping', view: VIEW } : { api: 'ping', token: S.token }).catch(function () {});   // しばらく通信していなければ、GAS を起こしておく（保存の最初の1回を遅くしない）
    days.forEach(function (day) {

  }

  }

  }

  // 保存する内容を組み立てる（下書きのある日すべて。シートごと）
  function plan() {
    var groups = {}, count = 0, ow = 0, problem = '';
    function grp(key) { return groups[key] = groups[key] || { key: key, cells: [], idxs: [], dels: [] }; }
    if (S.tai && S.delMode) {                     // 体入：選んだ1件ずつを消す
      weekDays(S.week).forEach(function (day) {
        var info = dayInfo(day); if (!info.usable) return;
        info.entries.forEach(function (e) {
          if (!S.taiDel[day.idx + ':' + e.row]) return;
          var g = grp(day.key);
          g.cells.push({ row: e.row, day: day.d, expect: e.v, value: null }); g.dels.push(day.idx + ':' + e.row); count++; ow++;
        });
      });
      return { del: true, groups: groups, count: count, ow: ow, problem: '' };
    }
    weekDays(S.week).forEach(function (day) {
      var v = val(S.draft[day.idx]); if (v === undefined) return;
      var info = dayInfo(day); if (!info.usable) return;
      var mo = S.months[day.key];
      if (!S.tai) {
        var g = grp(day.key);
        g.cells.push({ row: info.row, day: day.d, expect: info.cur, value: v }); g.idxs.push(day.idx); count++;
        if (info.cur && info.cur !== (v === null ? '' : v)) ow++;
      } else {
        var free = null;
        mo.taiRows.forEach(function (r) { if (free === null && !cell(mo, r, day.d)) free = r; });
        if (free === null) problem = day.m + '/' + day.d + ' は、体入の枠が埋まっています';
        else { var g2 = grp(day.key); g2.cells.push({ row: free, day: day.d, expect: '', value: v }); g2.idxs.push(day.idx); count++; }
      }
    });
    return { del: false, groups: groups, count: count, ow: ow, problem: problem };
  }

  // ---- 表示 -----------------------------------------------------------------
  var ICON_GEAR = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2.4"/><path stroke-width="3.4" d="M12 2.6v3M12 18.4v3M2.6 12h3M18.4 12h3M5.4 5.4l2.1 2.1M16.5 16.5l2.1 2.1M5.4 18.6l2.1-2.1M16.5 7.5l2.1-2.1"/></svg>';
  var TABS = {
    today: ['今日', '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>'],
    month: ['月', '<svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M9 9.5v10M15 9.5v10M3.5 14.5h17"/></svg>'],
    input: ['入力', '<svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg>']
  };

  function render() {
    if (!S.token) return;
    var page = S.settings ? 'settings' : S.tab;
    ['input', 'today', 'month', 'settings'].forEach(function (k) { $('pg' + k.charAt(0).toUpperCase() + k.slice(1)).hidden = (k !== page); });
    $('tabbar').hidden = S.settings;

    if (page === 'input') renderInput();
    else if (page === 'today') renderToday();
    else if (page === 'month') renderMonth();

  function renderInput() {
    var days = weekDays(S.week);
    [].forEach.call($('seg').children, function (b) { b.className = Number(b.getAttribute('data-w')) === S.week ? 'on' : ''; });

    // シートがない月のお知らせ
    var missing = [], seen = {};
    days.forEach(function (d) { var mo = S.months[d.key]; if (mo && mo.status === 'none' && !seen[d.key]) { seen[d.key] = 1; missing.push(d.key); } });
    var nt = $('notice');
    nt.hidden = !missing.length;
    $('noticeText').textContent = missing.length ? missing.join('、') + ' のシートが、まだありません' : '';

    renderDays(days);
    renderWho();

    $('inGrp').hidden = del;
    $('outGrp').hidden = S.tai;
    $('taiGrp').hidden = !S.tai;
    $('retaiLab').hidden = del; $('retaiSw').hidden = del;

      S.tai ? null : [{ label: MARU, on: allFlag('maru'), fn: function () { toggleFlag('maru', 'clear'); } }]);
    renderChips($('outChips'), OUT_VALS, 'o', [{ label: 'クリア', on: allFlag('clear'), fn: function () { toggleFlag('clear', 'maru'); } }]);
    $('retai').checked = allFlag('retai');
    $('clear').className = 'chip act' + (del ? ' on' : '');
    $('clear').textContent = del ? '消すのをやめる' : '体入を消す';
    renderPreview();
  }

  // 人の選択（日付と時間の間）：名前を左右に流す。選んでいる人は、見える位置に寄せる
  function renderWho() {
    var el = $('who'); el.innerHTML = '';
    var cur = null;
    peopleList().forEach(function (name) {
      var b = document.createElement('button'); b.className = 'nm' + (!S.tai && S.person === name ? ' on' : ''); b.textContent = name;
      b.onclick = function () { pickPerson(name); };
      if (!S.tai && S.person === name) cur = b;
      el.appendChild(b);
    });
    var t = document.createElement('button'); t.className = 'nm tai' + (S.tai ? ' on' : ''); t.textContent = '体入';
    t.onclick = function () { pickPerson(null); };
    if (S.tai) cur = t;
    el.appendChild(t);
    var key = S.tai ? '体入' : (S.person || '');
    if (cur && S.whoKey !== key) { el.scrollLeft = cur.offsetLeft - (el.clientWidth - cur.offsetWidth) / 2; S.whoKey = key; }
    else if (S.whoScroll != null) el.scrollLeft = S.whoScroll;
    el.onscroll = function () { S.whoScroll = el.scrollLeft; };
  }
  function pickPerson(name) {                       // name が null なら体入
    if (name === null ? S.tai : (!S.tai && S.person === name)) return;
    guard(function () {
      if (name === null) S.tai = true; else { S.person = name; S.tai = false; store.set(PERSON_KEY, name); }
      resetInput(); render();
    });
  }

  // 今日・月から、その人とその日を選んだ入力タブを開く（name が null なら体入）
  function openInput(name, date) {
    if (VIEW) return;   // 閲覧専用：入力は開かない
    var mon = addDays(date, -weekdayIdx(date)), tmon = addDays(S.today, -weekdayIdx(S.today));
    var w = Math.round((Date.UTC(mon.y, mon.m - 1, mon.d) - Date.UTC(tmon.y, tmon.m - 1, tmon.d)) / (7 * 86400000));
    if (w < 0 || w > 2) { toast('入力できるのは、今週〜再来週です'); return; }
    guard(function () {
      S.tab = 'input'; S.settings = false;
      if (name === null) S.tai = true; else { S.person = name; S.tai = false; store.set(PERSON_KEY, name); }
      S.week = w; resetInput();
      var idx = weekdayIdx(date); if (idx < 6) S.sel[idx] = 1;
      render(); loadWeek(w);
    });
  }

  // 今日：その日の出勤者を、入りの早い順に
  function startRank(v) {                            // 並べ替えの値（数字の入り → 同 → 上がりだけ → 〇）
    var m = v.match(/^(?:再体 )?(\d{1,2}(?:\.5)?)/);
    if (m) return Number(m[1]);
    if (v.charAt(0) === '同') return 100;
    if (v.charAt(0) === '-') return 101;
    return 102;
  }
  function renderToday() {
    var day = S.tDay, key = sheetName(day.y, day.m), wi = weekdayIdx(day);
    $('tTitle').textContent = day.m + '/' + day.d + '（' + WD[wi] + '）';
    $('tBiz').hidden = cmpDate(day, S.today) !== 0;
    var list = $('tList'), sum = $('tSum'), hn = holidayName(day); list.innerHTML = ''; sum.textContent = '';
    if (hn) sum.innerHTML = '<b class="hol">祝</b> ' + esc(hn);
    function msg(t) { list.innerHTML = '<div class="empty">' + esc(t) + '</div>'; }
    if (wi === 6) { msg('定休日です'); return; }
    need(key);
    var mo = S.months[key];
    if (!mo || mo.status === 'loading') { msg('読み込み中 …'); return; }
    if (mo.status === 'none') { msg(key + ' のシートが、まだありません'); return; }
    if (mo.status === 'error') { msg('読み込めませんでした'); return; }
    if (mo.days.indexOf(day.d) < 0) { msg('この日の列が、シートにありません'); return; }
    var cast = [], tai = [];
    mo.people.forEach(function (p) { var v = cell(mo, p.row, day.d); if (v) cast.push({ name: p.name, v: v }); });
    mo.taiRows.forEach(function (r) { var v = cell(mo, r, day.d); if (v) tai.push({ name: '体入', v: v, tai: true }); });
    function byStart(a, b) { return startRank(a.v) - startRank(b.v); }
    cast.sort(byStart); tai.sort(byStart);
    var all = cast.concat(tai);
    sum.innerHTML = (hn ? '<b class="hol">祝</b> ' + esc(hn) + ' ・ ' : '') + '<b>' + all.length + '人</b> 出勤' + (tai.length ? ' ・ うち体入 ' + tai.length + '人' : '');
    if (!all.length) { msg('出勤の入力は、まだありません'); return; }
    all.forEach(function (e) {
      var r = document.createElement('div'); r.className = 'row' + (e.tai ? ' tai' : '');
      r.innerHTML = '<span class="n">' + esc(e.name) + '</span><span class="t">' + esc(e.v === MARU ? MARU + ' 時間未定' : e.v) + '</span>';
      r.onclick = function () { openInput(e.tai ? null : e.name, day); };

    });
  }

  // 月（案A）：全員×日付。名前の列と日付の行は固定。最初は、今日が見える位置から
  function renderMonth() {
    var mm = S.mMonth, key = sheetName(mm.y, mm.m);
    $('mTitle').textContent = mm.m + '月' + (mm.y !== S.today.y ? '（' + mm.y + '）' : '');
    need(key);
    var mo = S.months[key], wrap = $('mWrap');
    function msg(t) { wrap.innerHTML = '<div class="empty">' + esc(t) + '</div>'; $('mHint').hidden = true; }
    if (!mo || mo.status === 'loading') { msg('読み込み中 …'); return; }
    if (mo.status === 'none') { msg(key + ' のシートが、まだありません'); return; }
    if (mo.status === 'error') { msg('読み込めませんでした'); return; }
    $('mHint').hidden = false;
    var dim = new Date(Date.UTC(mm.y, mm.m, 0)).getUTCDate(), mdays = mo.days.filter(function (d) { return d <= dim; });   // シートに残っている、その月に無い日（11月の31日など）は出さない
    var oldL = wrap.scrollLeft, oldT = wrap.scrollTop, same = S.mKey === key;
    var isNow = mm.y === S.today.y && mm.m === S.today.m;
    var h = '<table><thead><tr><th class="n">' + mm.m + '月</th>';
    mdays.forEach(function (d) {
      var wi = weekdayIdx({ y: mm.y, m: mm.m, d: d });
      var hn = holidayName({ y: mm.y, m: mm.m, d: d });
      h += '<th class="' + (isNow && d === S.today.d ? 'today ' : '') + (wi === 6 ? 'sun' : '') + (wi === 2 ? 'wed' : '') + '"' + (hn ? ' title="' + esc(hn) + '"' : '') + '><span class="dn">' + d + '</span><small>' + WD[wi] + (hn ? '<b class="hol">祝</b>' : '') + '</small></th>';
    });
    h += '</tr></thead><tbody>';
    function cls(d) { var wi = weekdayIdx({ y: mm.y, m: mm.m, d: d }); return (isNow && d === S.today.d ? 'today ' : '') + (wi === 6 ? 'sun' : ''); }
    mo.people.forEach(function (p) {
      h += '<tr><td class="n">' + esc(p.name) + '</td>';
      mdays.forEach(function (d) {
        var v = weekdayIdx({ y: mm.y, m: mm.m, d: d }) === 6 ? '' : cell(mo, p.row, d);
        h += '<td class="' + cls(d) + '" data-p="' + esc(p.name) + '" data-d="' + d + '">' + esc(v) + '</td>';
      });
      h += '</tr>';
    });
    h += '<tr><td class="n t">体入</td>';
    mdays.forEach(function (d) {
      var n = mo.taiRows.filter(function (r) { return cell(mo, r, d); }).length;
      h += '<td class="' + cls(d) + '" data-p="" data-d="' + d + '" style="color:var(--sub)">' + (n ? n : '') + '</td>';
    });
    wrap.innerHTML = h + '</tr></tbody></table>';
    wrap.onclick = function (e) {
      var td = e.target.closest ? e.target.closest('td[data-d]') : null; if (!td) return;
      var p = td.getAttribute('data-p'), d = Number(td.getAttribute('data-d'));
      openInput(p === '' ? null : p, { y: mm.y, m: mm.m, d: d });
    };
    if (same) { wrap.scrollLeft = oldL; wrap.scrollTop = oldT; }
    else { wrap.scrollLeft = isNow ? Math.max(0, (S.today.d - 3) * 50) : 0; wrap.scrollTop = 0; S.mKey = key; }
  }

  // 設定：人の管理（追加・名前の変更・削除）、更新、ログアウト
  function fromKey() { return String(S.today.y).slice(-2) + '/' + (S.today.m < 10 ? '0' : '') + S.today.m; }
  function settingsPeople() {
    var mo = S.months[sheetName(S.today.y, S.today.m)];
    if (mo && mo.status === 'ok') return mo.people.map(function (p) { return p.name; });
    return peopleList();
  }
  function renderSettings() {
    var names = settingsPeople();
    $('sCount').textContent = '人の管理（' + names.length + '人 ・ 枠は21）';
    var el = $('sList'); el.innerHTML = '';
    names.forEach(function (n) {
      var r = document.createElement('div'); r.className = 'pr';
      r.innerHTML = esc(n) + '<span><button data-op="rename">変更</button><button class="d" data-op="remove">削除</button></span>';
      r.querySelector('[data-op=rename]').onclick = function () { showRename(n); };
      r.querySelector('[data-op=remove]').onclick = function () { showRemove(n); };
      el.appendChild(r);
    });
    $('sSync').textContent = S.lastSync ? new Date(S.lastSync).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : '';
  }

  function renderChips(el, vals, key, extras) {
    el.innerHTML = '';
    var cur = shared(key);
    function mk(label, cls, on, fn) {
      var b = document.createElement('button');
      b.className = 'chip ' + cls + (on ? ' on' : ''); b.textContent = label; b.onclick = fn; el.appendChild(b);
    }
    if (!S.tai) mk('空', 'dim', cur === '', function () { setField(key, ''); });
    vals.forEach(function (v) { mk(v, '', cur === v, function () { setField(key, v); }); });
    (extras || []).forEach(function (x) { mk(x.label, 'act', x.on, x.fn); });
  }

  function renderDays(days) {
    var box = $('days'); box.innerHTML = '';
    days.forEach(function (day) {
      var info = dayInfo(day);
      if (S.tai && S.delMode && info.usable) { box.appendChild(delRow(day, info)); return; }
      var sel = !!S.sel[day.idx] && info.usable;
      var nv = val(S.draft[day.idx]);
      var d = document.createElement('div');
      d.className = 'day' + (info.usable ? '' : ' off') + (sel ? ' sel' : '') + (day.past ? ' past' : '');
      var h = '<span class="box">' + (sel ? '✓' : '') + '</span>' +
              '<span class="d">' + WD[day.idx] + '<small>' + day.m + '/' + day.d + '</small>' + (day.hol ? '<b class="hol" title="' + esc(day.hol) + '">祝</b>' : '') + '</span><span class="vals">';
      if (!info.usable) {
        h += '<span class="pill">' + esc(info.note) + '</span>';
      } else if (nv !== undefined && S.tai) {
        h += (info.cur ? '<span class="pill">' + esc(info.cur) + '</span><span class="arrow">＋</span>' : '') + '<span class="pill new">' + esc(nv) + '</span>';
      } else if (nv !== undefined && info.cur !== (nv === null ? '' : nv)) {
        h += '<span class="pill was' + (info.cur ? '' : ' empty') + '">' + (info.cur ? esc(info.cur) : '—') + '</span>' +
             '<span class="arrow">→</span><span class="pill new">' + (nv === null ? '空' : esc(nv)) + '</span>';
      } else {
        h += '<span class="pill' + (info.cur ? '' : ' empty') + '">' + (info.cur ? esc(info.cur) : '—') + '</span>';
      }
      d.innerHTML = h + '</span>';
      if (info.usable) d.onclick = function () { S.sel[day.idx] = S.sel[day.idx] ? 0 : 1; render(); };
      box.appendChild(d);
    });
  }

  // 体入を消すモード：その日の体入を1件ずつ、タップで選ぶ（日の欄をタップすると、その日の分をまとめて選ぶ）
  function delRow(day, info) {
    var d = document.createElement('div');
    var any = info.entries.some(function (e) { return S.taiDel[day.idx + ':' + e.row]; });
    d.className = 'day' + (any ? ' sel' : '') + (day.past ? ' past' : '');
    d.innerHTML = '<span class="box">' + (any ? '✓' : '') + '</span><span class="d">' + WD[day.idx] + '<small>' + day.m + '/' + day.d + '</small></span>' +
      '<span class="vals ents">' + (info.entries.length
        ? info.entries.map(function (e) { return '<span class="pill ent' + (S.taiDel[day.idx + ':' + e.row] ? ' del' : '') + '" data-row="' + e.row + '">' + esc(e.v) + '</span>'; }).join('')
        : '<span class="pill empty">—</span>') + '</span>';
    d.onclick = function (ev) {
      var t = ev.target.closest ? ev.target.closest('.ent') : null;
      if (t) { var k = day.idx + ':' + t.getAttribute('data-row'); if (S.taiDel[k]) delete S.taiDel[k]; else S.taiDel[k] = 1; }
      else {
        var all = info.entries.length && info.entries.every(function (e) { return S.taiDel[day.idx + ':' + e.row]; });
        info.entries.forEach(function (e) { var k = day.idx + ':' + e.row; if (all) delete S.taiDel[k]; else S.taiDel[k] = 1; });
      }
      render();
    };
    return d;
  }

  function renderPreview() {
    var p = plan(), pv = $('preview'), sv = $('save');
    var who = S.tai ? '体入' : (S.person || '');
    function say(h) { pv.innerHTML = '<div>' + h + '</div>'; }
    sv.disabled = true; sv.textContent = '保存'; sv.className = 'save';
    if (p.del) {
      if (!p.count) { say('消す体入を、タップして選んでください（日の欄で、その日の分を全部）'); return; }
      say('<b>体入</b> の ' + p.count + '件を <b>空（クリア）</b>にします<br><span class="ow">入力済みの ' + p.count + '件が消えます</span>');
      sv.disabled = false; sv.textContent = p.count + '件を消す'; sv.className = 'save danger';
      return;
    }
    if (p.problem) { say('<span class="bad">' + esc(p.problem) + '</span>'); return; }
    if (!p.count) {
      say(selDays().length ? (S.tai ? '入りを選んでください' : '入りか上がりを選んでください') : '日付を選んで、入り・上がりを選びます');
      return;
    }
    var nvs = {}; Object.keys(p.groups).forEach(function (k) { p.groups[k].cells.forEach(function (c) { nvs[c.value === null ? '空' : c.value] = 1; }); });
    var vs = Object.keys(nvs);
    var clr = vs.length === 1 && vs[0] === '空', multi = vs.length > 1;
    var l2 = [];
    if (multi) l2.push('日ごとの値');
    if (p.ow) l2.push(clr ? '入力済みの ' + p.ow + '日分が消えます' : 'うち ' + p.ow + '日は上書き');
    say('<b>' + esc(who) + '</b> の <b>' + p.count + '日分</b>を' + (clr ? ' <b>空（クリア）</b>に' : (multi ? '書き込み' : '<b>「' + esc(vs[0]) + '」</b>で書き込み')) +
      (l2.length ? '<br><span class="ow">' + l2.join(' ・ ') + '</span>' : ''));
    sv.disabled = false; sv.textContent = p.count + '日分を保存';
  }

  // ---- 保存 -----------------------------------------------------------------
  function applyUpdate(key, updated) {
    var mo = S.months[key];
    updated.forEach(function (u) {
      mo.cells[u.row] = mo.cells[u.row] || {};
      if (u.display) mo.cells[u.row][u.day] = u.display; else delete mo.cells[u.row][u.day];
    });
  }

  function errText(r) {
    switch (r && r.error) {
      case 'nosheet': return 'シートが見つかりません';
      case 'rowchanged': return '名前の位置が変わっています。更新してください';
      case 'badday': case 'badrow': return 'シートの形が変わっています。更新してください';
      case 'badvalue': return 'この値は書き込めません';
      case 'server': return 'サーバーでエラーが起きました';
      default: return '保存できませんでした';
    }
  }

  // 下書きのある日すべてを、シートごとに1回で保存する。保存できたシートの日だけ、下書きと選択を消す
  // 保存：押した瞬間に「保存した」表示にして、裏で順番に保存する。失敗したら、元に戻して知らせる
  function setCell(key, row, day, v) {
    var mo = S.months[key]; if (!mo) return;
    mo.cells[row] = mo.cells[row] || {};
    if (v) mo.cells[row][day] = v; else delete mo.cells[row][day];
  }

  function doSave(force) {
    var p = plan();
    if (!p.count || p.problem) return;
    var ctx = { person: S.person, tai: S.tai, week: S.week }, items = [];
    Object.keys(p.groups).forEach(function (k) {
      var g = p.groups[k]; if (!g.cells.length) return;
      var mo = S.months[k];
      var it = { key: k, cells: g.cells, ctx: ctx, force: !!force, name: S.tai ? null : S.person, dels: g.dels.slice(), drafts: {},
        prev: g.cells.map(function (c) { return { row: c.row, day: c.day, was: cell(mo, c.row, c.day), now: c.value === null ? '' : c.value }; }) };
      g.idxs.forEach(function (i) { it.drafts[i] = { d: S.draft[i], sel: S.sel[i] }; });
      items.push(it);
    });
    items.forEach(function (it) {                    // 先に、保存した表示にする
      it.prev.forEach(function (c) { setCell(it.key, c.row, c.day, c.now); });
      Object.keys(it.drafts).forEach(function (i) { delete S.draft[i]; delete S.sel[i]; });
      it.dels.forEach(function (x) { delete S.taiDel[x]; });
    });
    S.inflight += items.length;
    items.forEach(function (it) { S.queue = S.queue.then(function () { return runSave(it); }); });
    render();
  }

  function runSave(it) {
    if (S.abort) { rollback(it); return finishItem(); }          // 前の保存が失敗したら、あとの分は送らずに戻す
    return api({ api: 'save', token: S.token, sheet: it.key, name: it.name, cells: it.cells, force: it.force }).then(function (r) {
      if (r.ok) { applyUpdate(it.key, r.updated); S.lastSync = Date.now(); return finishItem(); }
      S.abort = true;
      if (r.error === 'auth') S.failMsg = 'auth';
      else if (r.error === 'conflict') { r.key = it.key; S.pendingConflict = { it: it, r: r }; }
      else S.failMsg = errText(r);
      rollback(it);
      return finishItem();
    }, function () {
      S.abort = true; S.failMsg = '通信に失敗しました。もう一度お試しください'; rollback(it);
      return finishItem();
    });
  }

  function sameCtx(it) { return S.person === it.ctx.person && S.tai === it.ctx.tai && S.week === it.ctx.week; }
  function rollback(it) {                            // 表示と下書きを、保存する前に戻す
    var mo = S.months[it.key]; if (!mo) return;
    it.prev.forEach(function (c) { if (cell(mo, c.row, c.day) === c.now) setCell(it.key, c.row, c.day, c.was); });
    if (!sameCtx(it)) { if (S.failMsg !== 'auth') S.failMsg = (it.name || '体入') + ' の保存ができませんでした。入力し直してください'; return; }   // 人や週が変わっていたら、下書きは戻さない
    Object.keys(it.drafts).forEach(function (i) { var o = it.drafts[i]; if (!S.draft[i] && o.d) S.draft[i] = o.d; if (o.sel) S.sel[i] = o.sel; });
    it.dels.forEach(function (x) { S.taiDel[x] = 1; });
  }

  function finishItem() {
    S.inflight--;
    if (S.inflight > 0) { render(); return; }
    var abort = S.abort, msg = S.failMsg, pc = S.pendingConflict;
    S.abort = false; S.failMsg = ''; S.pendingConflict = null;
    if (!abort) { toast('保存しました'); render(); return; }
    if (msg === 'auth') { logout('ログインの期限が切れました。もう一度ログインしてください'); return; }
    if (pc && sameCtx(pc.it)) showConflict(pc.r);
    else if (pc) toast((pc.it.name || '体入') + ' の保存ができませんでした（シートが変更されていました）。入力し直してください');
    else if (msg) toast(msg);
    refreshAll();                                    // シートの実際の状態に合わせ直す
    render();
  }

  // ---- ダイアログ -------------------------------------------------------------------
  function closeDlg() { $('dlgRoot').innerHTML = ''; }
  function openDlg(html, wire) {
    $('dlgRoot').innerHTML = '<div class="veil" id="veil"></div><div class="sheet">' + html + '</div>';
    $('veil').onclick = closeDlg;
    wire();
  }
  function showConflict(r) {
    var items = r.conflicts.map(function (c) {
      return '<li>' + c.day + '日：<s>' + esc(c.expect || '空') + '</s> → 今は <b>' + esc(c.current || '空') + '</b></li>';
    }).join('');
    openDlg('<h2>シートが変更されています</h2><p>画面を開いてから、シートが直接書き換えられました。そのまま保存すると、上書きされます。</p><ul>' + items + '</ul>' +
      '<div class="btns"><button class="main" id="dReload">最新の状態を読み込む</button><button class="danger" id="dForce">このまま上書きする</button><button id="dCancel">やめる</button></div>', function () {
      $('dCancel').onclick = closeDlg;
      $('dReload').onclick = function () { closeDlg(); loadMonth(r.key, true).then(render); };
      $('dForce').onclick = function () { closeDlg(); doSave(true); };
    });
  }
  // ---- 新しいシート（今月の次の月）を作る ----------------------------------------------------
  var making = false;
  function makeMonth() {
    if (making) return; making = true;
    $('mkBtn').disabled = true; $('sMake').disabled = true; toast('作っています …');
    var body = { api: 'createMonth', token: S.token };
    if (MOCK) body.mockToday = S.today.y % 100 * 100 + S.today.m;      // 開発用：偽の窓口に、今月を教える
    api(body).then(function (r) {
      making = false; $('mkBtn').disabled = false; $('sMake').disabled = false;
      if (r.error === 'auth') { logout('ログインの期限が切れました。もう一度ログインしてください'); return; }
      if (!r.ok) { toast(r.error === 'badsheet' ? 'シートの形が想定と違うため、作れません（' + (r.sheet || '') + '）' : r.error === 'nosheet' ? '元になるシートが、見つかりません' : '作れませんでした'); return; }
      toast(r.created ? '作りました（' + r.sheets.join('、') + '）' : '来月のシートは、もうあります（' + r.sheet + '）');
      refreshAll().then(function () { return loadWeek(S.week); });
    }, function () { making = false; $('mkBtn').disabled = false; $('sMake').disabled = false; toast('通信に失敗しました。もう一度お試しください'); });
  }

  // ---- 人の管理 ---------------------------------------------------------------------
  function peopleErr(r) {
    switch (r && r.error) {
      case 'exists': return '同じ名前が、すでにあります';
      case 'full': return '名前の枠がいっぱいです（' + (r.sheet || '') + '）';
      case 'badname': return '名前を確かめてください（12文字まで。「=」「+」「-」「@」で始められません）';
      case 'notfound': return 'その名前が、シートに見つかりません。更新してください';
      case 'nosheet': return '今月以降のシートが、見つかりません';
      case 'badsheet': return 'シートの形が想定と違うため、できませんでした（' + (r.sheet || '') + '）';
      case 'hasformula': return 'この人の行に数式が入っているため、自動では詰められません（' + (r.sheet || '') + '）';
      default: return '保存できませんでした';
    }
  }
  function callPeople(body) {
    return api({ api: 'people', token: S.token, from: fromKey(), op: body.op, name: body.name || '', newName: body.newName || '' });
  }
  function afterPeople(toastMsg) {
    closeDlg(); toast(toastMsg);
    return refreshAll();
  }
  function nameDialog(title, note, initial, okLabel, run) {
    openDlg('<h2>' + esc(title) + '</h2><p>' + note + '</p><input class="txt" id="nameIn" maxlength="12" autocomplete="off" placeholder="名前"><div class="msg" id="nameMsg"></div>' +
      '<div class="btns"><button class="main" id="dOk">' + esc(okLabel) + '</button><button id="dCancel">やめる</button></div>', function () {
      var inp = $('nameIn'); inp.value = initial || '';
      $('dCancel').onclick = closeDlg;
      var busy = false;
      $('dOk').onclick = function () {
        var v = inp.value.trim(); if (!v || busy) return;
        busy = true; $('nameMsg').textContent = '';
        run(v).then(function (r) { busy = false; if (r) $('nameMsg').textContent = r; }, function () { busy = false; $('nameMsg').textContent = '通信に失敗しました。もう一度お試しください'; });
      };
      inp.onkeydown = function (e) { if (e.key === 'Enter') $('dOk').click(); };
      setTimeout(function () { inp.focus(); }, 50);
    });
  }
  function showAdd() {
    nameDialog('キャストを追加', '今月とこれからの月のシートに、名前の一番後ろへ足します。', '', '追加する', function (name) {
      return callPeople({ op: 'add', name: name }).then(function (r) {
        if (r.error === 'auth') { logout('ログインの期限が切れました。もう一度ログインしてください'); return null; }
        if (!r.ok) return peopleErr(r);
        return afterPeople('追加しました').then(function () {
          if (!hasUnsaved()) { S.person = name; S.tai = false; store.set(PERSON_KEY, name); resetInput(); }
          render(); return null;
        });
      });
    });
  }
  function showRename(old) {
    nameDialog('名前を変更', '「' + esc(old) + '」を、今月とこれからの月のシートで書き換えます。出勤の入力は、そのまま残ります。', old, '変更する', function (nn) {
      if (nn === old) { closeDlg(); return Promise.resolve(null); }
      return callPeople({ op: 'rename', name: old, newName: nn }).then(function (r) {
        if (r.error === 'auth') { logout('ログインの期限が切れました。もう一度ログインしてください'); return null; }
        if (!r.ok) return peopleErr(r);
        if (S.person === old) { S.person = nn; store.set(PERSON_KEY, nn); }
        return afterPeople('変更しました').then(function () { return null; });
      });
    });
  }
  function showRemove(name) {
    callPeople({ op: 'info', name: name }).then(function (r) {
      if (r.error === 'auth') { logout('ログインの期限が切れました。もう一度ログインしてください'); return; }
      if (!r.ok) { toast(peopleErr(r)); return; }
      function line(d) { return '<li>' + esc(d.sheet.replace(SHEET_SUFFIX, '')) + (d.keep ? '：入力が ' + d.days + '日分あるので、<b>そのまま残します</b>' : '：入力が無いので、<b>名前を消して、下の人を詰めます</b>') + '</li>'; }
      var items = '<ul>' + r.sheets.map(line).join('') + '</ul>';
      if (!r.removable) {
        openDlg('<h2>「' + esc(name) + '」さんは、まだ削除できません</h2><p>入力が入っているシートでは、名前を残します。入力が無くなってから、もう一度削除してください。</p>' + items +
          '<div class="btns"><button class="main" id="dCancel">閉じる</button></div>', function () { $('dCancel').onclick = closeDlg; });
        return;
      }
      openDlg('<h2>「' + esc(name) + '」さんを削除しますか？</h2><p>今月とこれからの月のシートのうち、入力が入っているシートは残し、入力が無いシートだけ名前を消します。過去の月は、そのまま残ります。</p>' + items +
        '<div class="btns"><button class="dn" id="dDel">削除する</button><button id="dCancel">やめる</button></div>', function () {
        $('dCancel').onclick = closeDlg;
        $('dDel').onclick = function () {
          $('dDel').disabled = true;
          callPeople({ op: 'remove', name: name }).then(function (r2) {
            if (r2.error === 'auth') { logout('ログインの期限が切れました。もう一度ログインしてください'); return; }
            if (!r2.ok) { closeDlg(); toast(peopleErr(r2)); return; }
            var kept = r2.sheets.some(function (d) { return d.keep; });
            afterPeople(kept ? '削除しました（入力のあるシートは、残しました）' : '削除しました').then(function () {
              if (S.person === name && peopleList().indexOf(name) < 0) { S.person = null; resetInput(); ensurePerson(); render(); }
            });
          }, function () { closeDlg(); toast('通信に失敗しました。もう一度お試しください'); });
        };
      });
    }, function () { toast('通信に失敗しました。もう一度お試しください'); });
  }

  // ---- ログイン・ログアウト ---------------------------------------------------------
  function showLogin(msg) {
    $('appView').hidden = true; $('loginView').hidden = false;
    $('loginMsg').textContent = msg || '';
    setTimeout(function () { $('pin').focus(); }, 50);
  }
  function logout(msg) {
    store.del(TOKEN_KEY); S.token = null; S.months = {}; S.sel = {}; S.draft = {}; S.taiDel = {}; S.delMode = false; S.person = null; S.settings = false; S.tab = 'input';
    closeDlg(); showLogin(msg);
  }
  function doLogin() {
    var pin = $('pin').value.trim(); if (!pin) return;
    var btn = $('loginBtn'); btn.disabled = true; $('loginMsg').textContent = '';
    api({ api: 'login', pin: pin }).then(function (r) {
      btn.disabled = false;
      if (r.ok) { store.set(TOKEN_KEY, r.token); S.token = r.token; $('pin').value = ''; start(); }
      else if (r.error === 'locked') $('loginMsg').textContent = '間違いが続いたため、しばらく入力できません（約10分）';
      else if (r.error === 'wrong') $('loginMsg').textContent = 'PINが違います。あと ' + r.remaining + ' 回で、しばらく入力できなくなります';
      else if (r.error === 'setup') $('loginMsg').textContent = 'サーバーの設定が済んでいません';
      else $('loginMsg').textContent = 'ログインできませんでした';
    }).catch(function () { btn.disabled = false; $('loginMsg').textContent = '通信に失敗しました。もう一度お試しください'; });
  }

  // ---- 開始 -----------------------------------------------------------------
  function start() {
    $('loginView').hidden = true; $('appView').hidden = false;
    S.today = businessToday(); S.week = 1; S.tab = VIEW ? 'today' : 'input'; S.settings = false; S.whoKey = ''; S.mKey = '';
    S.tDay = S.today; S.mMonth = { y: S.today.y, m: S.today.m };
    resetInput();
    render();
    if (VIEW) return;   // 閲覧専用：シートは、今日・月の描画が読む
    loadWeek(1).then(function () {
      // 来週のシートがまだ無い（月末など）ときは、今週を開く
      var ok = weekDays(1).some(function (d) { var mo = S.months[d.key]; return mo && mo.status === 'ok'; });
      if (!ok) { S.week = 0; return loadWeek(0); }
    }).then(render);
  }

  function resetInput() { S.sel = {}; S.draft = {}; S.taiDel = {}; S.delMode = false; }

  // 未保存の下書きがあれば、確認してから切り替える
  function guard(go) {
    if (!hasUnsaved()) { go(); return; }
    openDlg('<h2>未保存の下書きがあります</h2><p>切り替えると、下書きは消えます。</p>' +
      '<div class="btns"><button class="main" id="dBack">戻る</button><button class="danger" id="dDiscard">破棄して切り替える</button></div>', function () {
      $('dBack').onclick = closeDlg;
      $('dDiscard').onclick = function () { closeDlg(); go(); };
    });
  }

  function wire() {
    $('loginBtn').onclick = doLogin;
    $('pin').onkeydown = function (e) { if (e.key === 'Enter') doLogin(); };
    [].forEach.call(document.querySelectorAll('[data-gear]'), function (g) { g.onclick = function () { S.settings = true; render(); }; });
    $('sBack').onclick = function () { S.settings = false; render(); };
    $('sAdd').onclick = showAdd;
    $('addBtn').onclick = showAdd;
    $('mkBtn').onclick = makeMonth;
    $('sMake').onclick = makeMonth;
    $('sReload').onclick = function () { toast('更新しています …'); refreshAll(); };
    $('sLogout').onclick = function () { logout(''); };
    $('tabbar').onclick = function (e) {
      var b = e.target.closest ? e.target.closest('[data-tab]') : null; if (!b) return;
      S.tab = b.getAttribute('data-tab'); render();
    };
    $('seg').onclick = function (e) {
      var w = e.target.getAttribute('data-w'); if (w === null || Number(w) === S.week) return;
      guard(function () { S.week = Number(w); S.sel = {}; S.draft = {}; S.taiDel = {}; render(); loadWeek(S.week); });
    };
    $('tPrev').onclick = function () { S.tDay = addDays(S.tDay, -1); render(); };
    $('tNext').onclick = function () { S.tDay = addDays(S.tDay, 1); render(); };
    $('tTitle').onclick = function () { S.tDay = S.today; render(); };
    $('mPrev').onclick = function () { var m = S.mMonth; S.mMonth = m.m === 1 ? { y: m.y - 1, m: 12 } : { y: m.y, m: m.m - 1 }; render(); };
    $('mNext').onclick = function () { var m = S.mMonth; S.mMonth = m.m === 12 ? { y: m.y + 1, m: 1 } : { y: m.y, m: m.m + 1 }; render(); };
    $('clear').onclick = function () { S.delMode = !S.delMode; S.taiDel = {}; S.sel = {}; render(); };
    $('retai').onchange = function () {
      var on = this.checked;
      apply(function (d) { d.retai = on; });
    };
    $('save').onclick = function () { doSave(false); };
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { S.hiddenAt = Date.now(); return; }
      if (S.token && S.hiddenAt && Date.now() - S.hiddenAt > 120000) refreshAll();
    });
  }

  function viewMode() {
    document.documentElement.classList.add('view');
    document.title = '出勤表（閲覧）';
    // ホーム画面に追加しても、このリンク（鍵つき）で開くように
    var mf = document.querySelector('link[rel=manifest]');
    if (mf && window.Blob && URL.createObjectURL) {
      var base = new URL('.', location.href).href;
      var m = { name: '出勤表（閲覧）', short_name: '出勤表', start_url: location.href, scope: base, display: 'standalone', background_color: '#1c1c1e', theme_color: '#1c1c1e',
        icons: [{ src: base + 'icon-192.png', sizes: '192x192', type: 'image/png' }, { src: base + 'icon-512.png', sizes: '512x512', type: 'image/png' }] };
      mf.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
    }
    var t = document.querySelector('meta[name=apple-mobile-web-app-title]'); if (t) t.content = '出勤表';
    S.token = 'view'; start();
  }

  function init() {
    wire();
    if (VIEW) { viewMode(); return; }
    if (MOCK && !qs.has('login')) { S.token = 'mock'; start(); return; }   // 開発用：?mock&login でログイン画面も試せる
    S.token = store.get(TOKEN_KEY);
    if (S.token) start(); else showLogin('');
  }

  // 開発用：外から状態を見る（本番では使わない）
  window.__shift = { S: S, plan: plan, weekDays: weekDays, dayInfo: dayInfo, openInput: openInput, holidayName: holidayName };

  if (MOCK) {
    var s = document.createElement('script');
    s.src = '../dev/mock-api.js';
    s.onload = init; s.onerror = function () { document.body.textContent = 'dev/mock-api.js が見つかりません'; };
    document.head.appendChild(s);
  } else {
    init();
  }
})();
</script>
</body>
</html>
