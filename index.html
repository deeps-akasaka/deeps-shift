<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>出勤UI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="出勤UI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1c1e">
<style>
  /* iPhone 標準アプリ（カレンダー）のダークモード風。色は「青」ひとつだけ（選んだもの・新しい値・保存） */
  :root {
    --bg: #1c1c1e; --card: #2c2c2e; --pill: #3a3a3c; --sep: #3a3a3c;
    --ink: #ffffff; --sub: #98989d; --faint: #636366; --accent: #0a84ff; --seg-on: #636366; --danger: #ff453a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); height: 100%; overflow: hidden; }
  body { color: var(--ink); font-family: -apple-system, "SF Pro Text", "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
  button { font-family: inherit; color: var(--ink); touch-action: manipulation; }
  [hidden] { display: none !important; }

  /* 1画面：上（人・週）／中（日付、残りの高さ）／下（入り・上がり・保存） */
  .app { max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); }

  .top { padding: calc(10px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left)); }
  .row1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .who { display: flex; align-items: baseline; gap: 8px; border: 0; background: transparent; padding: 2px 0; min-width: 0; }
  .who b { font-size: 26px; font-weight: 600; }
  .who small { font-size: 12px; color: var(--sub); }
  .who i { font-style: normal; color: var(--faint); font-size: 14px; }
  .biz { font-size: 12px; color: var(--sub); background: var(--card); padding: 6px 12px; border: 0; border-radius: 999px; font-variant-numeric: tabular-nums; flex: none; }
  .biz::after { content: "  ⋯"; color: var(--faint); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 8px 0; font-size: 14px; border-radius: 9px; }
  .seg button.on { background: var(--seg-on); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  .notice { font-size: 12px; color: var(--sub); text-align: center; margin: 8px 0 0; }

  /* 中：日付（1行を低く。足りなければ、中でスクロール） */
  .days { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); background: var(--card); border-radius: 16px; }
  .day { position: relative; display: flex; align-items: center; padding: 0 12px 0 14px; min-height: 44px; cursor: pointer; }
  .day + .day::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 1px solid var(--sep); }
  .day .box { width: 22px; height: 22px; border: 2px solid var(--faint); border-radius: 50%; margin-right: 10px; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
  .day.sel .box { background: var(--accent); border-color: var(--accent); }
  .day .d { width: 76px; font-size: 16px; flex: none; }
  .day .d small { color: var(--sub); font-size: 12px; margin-left: 3px; font-variant-numeric: tabular-nums; }
  .day.past .d { color: var(--sub); }
  .day .vals { margin-left: auto; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .day .pill { font-size: 15px; padding: 4px 11px; border-radius: 999px; background: var(--pill); min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day .pill.empty { background: transparent; color: var(--faint); }
  .day .pill.was { background: transparent; color: var(--sub); text-decoration: line-through; padding-right: 0; }
  .day .pill.new { background: var(--accent); font-weight: 700; flex: none; }
  .day .arrow { color: var(--faint); font-size: 12px; flex: none; }
  .day .vals.ents { flex-wrap: wrap; justify-content: flex-end; gap: 6px; padding: 6px 0; }
  .day .pill.ent.del { background: var(--danger); font-weight: 700; }
  .day.off { opacity: .45; cursor: default; }
  .day.off .box { border-style: dotted; }
  .day.off .pill { background: transparent; font-size: 12px; }

  /* 下：入り・上がり・保存（画面の下に固定） */
  .dock { padding: 10px max(14px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
  .grp { display: flex; gap: 8px; margin-bottom: 8px; }
  .lab { width: 40px; flex: none; font-size: 12px; color: var(--sub); padding-top: 11px; line-height: 1.2; }
  .chips { flex: 1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; min-width: 0; }
  .chip { border: 0; background: var(--pill); border-radius: 999px; height: 38px; font-size: 16px; font-variant-numeric: tabular-nums; padding: 0; }
  .chip.dim { color: var(--sub); }
  .chip.on { background: var(--accent); font-weight: 700; }
  .chip.act { background: transparent; border: 1px solid var(--faint); font-size: 13px; }
  .chip.act.on { background: var(--accent); border-color: var(--accent); }
  .taiopt { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
  .taiopt .sw { display: flex; align-items: center; gap: 10px; font-size: 15px; flex: none; }
  .taiopt .chip { flex: 1; }
  .switch { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 999px; background: #48484a; position: relative; transition: background .2s; margin: 0; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { left: 22px; }
  .savebar { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .preview { flex: 1; font-size: 12.5px; line-height: 1.45; color: var(--sub); min-width: 0; min-height: 36px; display: flex; align-items: center; }
  .preview > div { min-width: 0; }
  .preview b { color: var(--ink); font-weight: 600; }
  .preview .ow { color: var(--ink); }
  .preview .ow::before { content: "↻ "; color: var(--sub); }
  .preview .bad { color: var(--danger); }
  .save { flex: none; width: 124px; height: 48px; border: 0; border-radius: 999px; background: var(--accent); font-size: 16px; font-weight: 700; }
  .save.danger { background: var(--danger); }
  .save:disabled { background: var(--pill); color: var(--faint); }
  @media (max-height: 700px) { .chip { height: 34px; } .day { min-height: 40px; } .save { height: 44px; } .top { padding-top: calc(6px + env(safe-area-inset-top)); } .who b { font-size: 22px; } }

  .toast { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: var(--pill); font-size: 14px; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }

  /* ログイン */
  .login { max-width: 480px; margin: 0 auto; padding: calc(80px + env(safe-area-inset-top)) 24px 40px; }
  .login h1 { font-size: 30px; margin: 0 0 6px; }
  .login p { color: var(--sub); margin: 0 0 28px; font-size: 14px; }
  .login input { width: 100%; font-size: 22px; padding: 16px 18px; border-radius: 16px; border: 0; background: var(--card); color: var(--ink); letter-spacing: .3em; outline: none; }
  .login .msg { min-height: 22px; margin: 12px 4px 0; font-size: 14px; color: var(--danger); }
  .login .go { width: 100%; margin-top: 12px; font-size: 17px; font-weight: 700; padding: 17px; border: 0; border-radius: 999px; background: var(--accent); }
  .login .go:disabled { background: var(--pill); color: var(--faint); }

  /* 下から出る一覧・ダイアログ */
  .veil { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; }
  .sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; background: var(--card); border-radius: 26px 26px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); z-index: 21; }
  .sheet h2 { font-size: 18px; margin: 0 0 8px; }
  .sheet h3 { margin: 0 0 12px 4px; font-size: 14px; color: var(--sub); font-weight: 400; }
  .sheet p { margin: 0 0 14px; color: var(--sub); font-size: 14px; line-height: 1.6; }
  .sheet ul { list-style: none; padding: 0; margin: 0 0 16px; }
  .sheet li { padding: 10px 0; border-top: 1px solid var(--sep); font-size: 15px; font-variant-numeric: tabular-nums; }
  .sheet li s { color: var(--sub); }
  .sheet .btns { display: grid; gap: 10px; }
  .sheet .btns button { font-size: 16px; padding: 15px; border: 0; border-radius: 16px; background: var(--pill); }
  .sheet .btns button.main { background: var(--accent); font-weight: 700; }
  .sheet .btns button.danger { color: var(--danger); }
  #picker, #pveil { display: none; }
  #picker.open, #pveil.open { display: block; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid button { font-size: 15px; padding: 12px 0; border-radius: 14px; border: 0; background: var(--pill); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid button.on { background: var(--accent); font-weight: 600; }
  .grid button.tai { grid-column: span 4; background: transparent; border: 1px dashed var(--faint); color: var(--sub); }
  .grid button.tai.on { border-style: solid; background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>

<div class="login" id="loginView" hidden>
  <h1>出勤UI</h1>
  <p>PIN を入力してください</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="16" aria-label="PIN">
  <div class="msg" id="loginMsg"></div>
  <button class="go" id="loginBtn">ログイン</button>
</div>

<div class="app" id="appView" hidden>
  <div class="top">
    <div class="row1">
      <button class="who" id="pchange"><b id="pname"></b><small id="psub"></small><i>▾</i></button>
      <button class="biz" id="menuBtn"></button>
    </div>
    <div class="seg" id="seg">
      <button data-w="0">今週</button><button data-w="1">来週</button><button data-w="2">再来週</button>
    </div>
    <p class="notice" id="notice" hidden></p>
  </div>

  <div class="days" id="days"></div>

  <div class="dock">
    <div class="grp" id="inGrp"><span class="lab">入り</span><div class="chips" id="inChips"></div></div>
    <div class="grp" id="outGrp"><span class="lab">上がり</span><div class="chips" id="outChips"></div></div>
    <div class="grp" id="taiGrp" hidden>
      <span class="lab" id="retaiLab">再体</span>
      <div class="taiopt">
        <span class="sw" id="retaiSw"><input type="checkbox" class="switch" id="retai" aria-label="再体（再度体入）"></span>
        <button class="chip act" id="clear">体入を消す</button>
      </div>
    </div>
    <div class="savebar"><div class="preview" id="preview"></div><button class="save" id="save">保存</button></div>
  </div>
</div>

<div class="veil" id="pveil"></div>
<div class="sheet" id="picker"><h3>人を選ぶ</h3><div class="grid" id="pgrid"></div></div>
<div class="toast" id="toast"></div>
<div id="dlgRoot"></div>

<script>
(function () {
  'use strict';

  // ---- 設定 ---------------------------------------------------------------
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbwTXHJyn-snXYxaDFA_oswrmNWJrm4wVedPw1gd25jqaKkZ6zLM-0rf8BzirZEujw/exec';
  var SHEET_SUFFIX = ' テスト';   // この段階では、名前に「テスト」を含むシートだけを使う
  var TOKEN_KEY = 'shift-token';
  var PERSON_KEY = 'shift-person';
  var WD = ['月', '火', '水', '木', '金', '土', '日'];
  var IN_VALS = ['8', '8.5', '9', '9.5', '10', '10.5', '11', '11.5', '12'];
  var OUT_VALS = ['11', '11.5', '12', '12.5', '1', '1.5', '2', 'L'];
  var MARU = '〇';               // 表と同じ「〇」（U+3007）

  var qs = new URLSearchParams(location.search);
  var MOCK = qs.has('mock');      // 開発用：偽の窓口で動かす（本番では使わない）

  // ---- 小さな道具 -----------------------------------------------------------
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var toastTimer = null;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400);
  }

  // ---- 日付（営業日は、午前7時で切り替わる） ---------------------------------------
  function jstParts(ms) {
    var a = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ms)).split('-');
    return { y: +a[0], m: +a[1], d: +a[2] };
  }
  function businessToday() {
    var o = qs.get('today');                       // 開発用：?today=2026-10-29
    if (o && /^\d{4}-\d{2}-\d{2}$/.test(o)) { var a = o.split('-'); return { y: +a[0], m: +a[1], d: +a[2] }; }
    return jstParts(Date.now() - 7 * 3600 * 1000);
  }
  function addDays(p, n) {
    var dt = new Date(Date.UTC(p.y, p.m - 1, p.d + n));
    return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate() };
  }
  function weekdayIdx(p) { return (new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay() + 6) % 7; }   // 月曜=0 … 日曜=6
  function cmpDate(a, b) { return (a.y - b.y) || (a.m - b.m) || (a.d - b.d); }
  function sheetName(y, m) { return String(y).slice(-2) + '/' + (m < 10 ? '0' : '') + m + SHEET_SUFFIX; }

  // ---- 状態 -----------------------------------------------------------------
  var S = {
    token: null, today: null, week: 1, person: null, tai: false,
    months: {},                 // シート名 → { status, people, taiRows, cells, rowByName, days }
    sel: {},                    // 選んだ日（0〜6）
    draft: {},                  // 日ごとの下書き（0〜6）→ { i, o, maru, clear, retai }
    taiDel: {},                 // 体入の「消すもの」（'日の番号:行'）
    delMode: false,             // 体入を消すモード
    saving: false, lastSync: 0, hiddenAt: 0
  };

  function weekDays(w) {
    var base = addDays(S.today, -weekdayIdx(S.today) + 7 * w);
    var out = [];
    for (var i = 0; i < 7; i++) {
      var p = addDays(base, i);
      out.push({ idx: i, y: p.y, m: p.m, d: p.d, key: sheetName(p.y, p.m), closed: i === 6, past: cmpDate(p, S.today) < 0 });
    }
    return out;
  }
  function cell(mo, row, day) { var r = mo.cells[row]; return (r && r[day]) || ''; }

  // ---- 窓口（GAS）を呼ぶ ----------------------------------------------------------
  function api(body) {
    if (MOCK && window.MOCK_API) return window.MOCK_API(body);
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 30000);
    return fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // application/json は、ブラウザの事前確認が通らない
      body: JSON.stringify(body),
      signal: ctl.signal
    }).then(function (r) { clearTimeout(timer); return r.json(); }, function (e) { clearTimeout(timer); throw e; });
  }

  function loadMonth(key, silent) {
    var mo = S.months[key] = S.months[key] || { status: 'loading' };
    if (!silent || mo.status !== 'ok') mo.status = 'loading';
    render();
    return api({ api: 'getMonth', token: S.token, sheet: key }).then(function (r) {
      if (r.error === 'auth') { logout('ログインの期限が切れました。もう一度ログインしてください'); return; }
      mo.checkedAt = Date.now();
      if (!r.ok) { mo.status = (r.error === 'nosheet') ? 'none' : 'error'; return; }
      mo.status = 'ok'; mo.people = r.people; mo.taiRows = r.taiRows; mo.cells = r.cells; mo.days = r.days;
      mo.rowByName = {}; r.people.forEach(function (p) { mo.rowByName[p.name] = p.row; });
      S.lastSync = Date.now();
    }).catch(function () { if (mo.status !== 'ok') mo.status = 'error'; if (silent) toast('更新できませんでした'); });
  }
  function loadWeek(w, silent) {
    var seen = {};
    return Promise.all(weekDays(w).filter(function (d) { if (seen[d.key]) return false; seen[d.key] = 1; return true; }).map(function (d) {
      var mo = S.months[d.key];
      if (!silent && mo && (mo.status === 'ok' || (mo.status === 'none' && Date.now() - mo.checkedAt < 20000))) return null;
      return loadMonth(d.key, silent);
    })).then(ensurePerson).then(render);
  }
  function refreshAll() {
    var keys = Object.keys(S.months).filter(function (k) { return S.months[k].status === 'ok' || S.months[k].status === 'none'; });
    return Promise.all(keys.map(function (k) { return loadMonth(k, true); })).then(function () { render(); });
  }

  // ---- 人 -------------------------------------------------------------------
  function peopleList() {
    var list = null;
    weekDays(S.week).forEach(function (d) { var mo = S.months[d.key]; if (!list && mo && mo.status === 'ok') list = mo.people; });
    if (!list) Object.keys(S.months).forEach(function (k) { var mo = S.months[k]; if (!list && mo.status === 'ok') list = mo.people; });
    return (list || []).map(function (p) { return p.name; });
  }
  function ensurePerson() {
    var list = peopleList();
    if (S.person && list.indexOf(S.person) >= 0) return;
    var saved = store.get(PERSON_KEY);
    S.person = (saved && list.indexOf(saved) >= 0) ? saved : (list[0] || null);
  }

  // ---- 日ごとの今の値 ---------------------------------------------------------------
  function dayInfo(day) {
    var info = { day: day, cur: '', usable: false, note: '', row: 0 };
    if (day.closed) { info.note = '定休日'; return info; }
    var mo = S.months[day.key];
    if (!mo || mo.status === 'loading') { info.note = '読み込み中'; return info; }
    if (mo.status === 'none') { info.note = 'シートなし'; return info; }
    if (mo.status === 'error') { info.note = '読めません'; return info; }
    if (mo.days.indexOf(day.d) < 0) { info.note = '日付なし'; return info; }
    if (S.tai) {
      if (!mo.taiRows.length) { info.note = '体入の枠なし'; return info; }
      info.entries = mo.taiRows.map(function (r) { return { row: r, v: cell(mo, r, day.d) }; }).filter(function (e) { return e.v; });
      info.cur = info.entries.map(function (e) { return e.v; }).join(' / ');
      info.usable = true;
    } else {
      var row = mo.rowByName[S.person];
      if (!row) { info.note = '名前なし'; return info; }
      info.row = row; info.cur = cell(mo, row, day.d); info.usable = true;
    }
    return info;
  }

  // ---- 下書き（日ごと） ---------------------------------------------------------------
  // S.draft[日の番号] = { i, o, maru, clear, retai }。i・o は null＝まだ選んでいない、''＝「空」を選んだ
  function val(d) {                                  // その日の書き込む値（null＝空にする、undefined＝まだ決まっていない）
    if (!d) return undefined;
    if (S.tai) return d.i ? ((d.retai ? '再体 ' : '') + d.i) : undefined;
    if (d.clear) return null;
    if (d.maru) return MARU;
    var i = d.i, o = d.o;
    if (!i && !o) return undefined;
    if (i && !o) return i;                           // 入りだけ（ハイフンなし）
    if (!i && o) return '-' + o;                     // 上がりだけ
    return i + '-' + o;
  }
  function isEmptyDraft(d) { return d.i == null && d.o == null && !d.maru && !d.clear && !d.retai; }
  function selDays() {                               // 選んでいて、使える日
    return weekDays(S.week).filter(function (day) { return S.sel[day.idx] && dayInfo(day).usable; });
  }
  function selDrafts() { return selDays().map(function (day) { return S.draft[day.idx] || {}; }); }
  function shared(key) {                             // 選んだ日が全部同じ値のときだけ、その値（違えば undefined）
    var ds = selDrafts(); if (!ds.length) return undefined;
    var v = ds[0][key]; if (v == null) return undefined;
    for (var n = 1; n < ds.length; n++) if (ds[n][key] !== v) return undefined;
    return v;
  }
  function allFlag(key) { var ds = selDrafts(); return ds.length > 0 && ds.every(function (d) { return !!d[key]; }); }
  function apply(fn) {                               // 選んでいる日だけに、下書きを入れる
    var days = selDays();
    if (!days.length) { toast('日付を選んでください'); return; }
    days.forEach(function (day) {
      var d = S.draft[day.idx] = S.draft[day.idx] || {};
      fn(d);
      if (isEmptyDraft(d)) delete S.draft[day.idx];
    });
    render();
  }
  function setField(key, v) {                        // 同じ値が全部に入っていれば外す／そうでなければ全部をその値にする
    var off = shared(key) === v;
    apply(function (d) { d[key] = off ? null : v; d.maru = false; d.clear = false; });
  }
  function toggleFlag(key, other) {
    var off = allFlag(key);
    apply(function (d) { d[key] = !off; if (!off) { d[other] = false; d.i = null; d.o = null; } });
  }
  function hasUnsaved() { return Object.keys(S.draft).length > 0 || Object.keys(S.taiDel).length > 0; }

  // 保存する内容を組み立てる（下書きのある日すべて。シートごと）
  function plan() {
    var groups = {}, count = 0, ow = 0, problem = '';
    function grp(key) { return groups[key] = groups[key] || { key: key, cells: [], idxs: [], dels: [] }; }
    if (S.tai && S.delMode) {                     // 体入：選んだ1件ずつを消す
      weekDays(S.week).forEach(function (day) {
        var info = dayInfo(day); if (!info.usable) return;
        info.entries.forEach(function (e) {
          if (!S.taiDel[day.idx + ':' + e.row]) return;
          var g = grp(day.key);
          g.cells.push({ row: e.row, day: day.d, expect: e.v, value: null }); g.dels.push(day.idx + ':' + e.row); count++; ow++;
        });
      });
      return { del: true, groups: groups, count: count, ow: ow, problem: '' };
    }
    weekDays(S.week).forEach(function (day) {
      var v = val(S.draft[day.idx]); if (v === undefined) return;
      var info = dayInfo(day); if (!info.usable) return;
      var mo = S.months[day.key];
      if (!S.tai) {
        var g = grp(day.key);
        g.cells.push({ row: info.row, day: day.d, expect: info.cur, value: v }); g.idxs.push(day.idx); count++;
        if (info.cur && info.cur !== (v === null ? '' : v)) ow++;
      } else {
        var free = null;
        mo.taiRows.forEach(function (r) { if (free === null && !cell(mo, r, day.d)) free = r; });
        if (free === null) problem = day.m + '/' + day.d + ' は、体入の枠が埋まっています';
        else { var g2 = grp(day.key); g2.cells.push({ row: free, day: day.d, expect: '', value: v }); g2.idxs.push(day.idx); count++; }
      }
    });
    return { del: false, groups: groups, count: count, ow: ow, problem: problem };
  }

  // ---- 表示 -----------------------------------------------------------------
  function render() {
    if (!S.token) return;
    var days = weekDays(S.week);
    $('menuBtn').textContent = '営業日 ' + S.today.m + '/' + S.today.d + '（' + WD[weekdayIdx(S.today)] + '）';

    $('pname').textContent = S.tai ? '体入' : (S.person || '—');
    $('psub').textContent = S.tai ? '名前なしの枠' : '';
    [].forEach.call($('seg').children, function (b) { b.className = Number(b.getAttribute('data-w')) === S.week ? 'on' : ''; });

    // シートがない月のお知らせ
    var missing = [], seen = {};
    days.forEach(function (d) { var mo = S.months[d.key]; if (mo && mo.status === 'none' && !seen[d.key]) { seen[d.key] = 1; missing.push(d.key); } });
    var nt = $('notice');
    nt.hidden = !missing.length;
    nt.textContent = missing.length ? missing.join('、') + ' のシートが、まだありません' : '';

    renderDays(days);
    var del = S.tai && S.delMode;
    $('inGrp').hidden = del;
    $('outGrp').hidden = S.tai;
    $('taiGrp').hidden = !S.tai;
    $('retaiLab').hidden = del; $('retaiSw').hidden = del;
    renderChips($('inChips'), S.tai ? IN_VALS : IN_VALS.concat(['同']), 'i',
      S.tai ? null : [{ label: MARU, on: allFlag('maru'), fn: function () { toggleFlag('maru', 'clear'); } }]);
    renderChips($('outChips'), OUT_VALS, 'o', [{ label: 'クリア', on: allFlag('clear'), fn: function () { toggleFlag('clear', 'maru'); } }]);
    $('retai').checked = allFlag('retai');
    $('clear').className = 'chip act' + (del ? ' on' : '');
    $('clear').textContent = del ? '消すのをやめる' : '体入を消す';
    renderPreview();
  }

  function renderChips(el, vals, key, extras) {
    el.innerHTML = '';
    var cur = shared(key);
    function mk(label, cls, on, fn) {
      var b = document.createElement('button');
      b.className = 'chip ' + cls + (on ? ' on' : ''); b.textContent = label; b.onclick = fn; el.appendChild(b);
    }
    if (!S.tai) mk('空', 'dim', cur === '', function () { setField(key, ''); });
    vals.forEach(function (v) { mk(v, '', cur === v, function () { setField(key, v); }); });
    (extras || []).forEach(function (x) { mk(x.label, 'act', x.on, x.fn); });
  }

  function renderDays(days) {
    var box = $('days'); box.innerHTML = '';
    days.forEach(function (day) {
      var info = dayInfo(day);
      if (S.tai && S.delMode && info.usable) { box.appendChild(delRow(day, info)); return; }
      var sel = !!S.sel[day.idx] && info.usable;
      var nv = val(S.draft[day.idx]);
      var d = document.createElement('div');
      d.className = 'day' + (info.usable ? '' : ' off') + (sel ? ' sel' : '') + (day.past ? ' past' : '');
      var h = '<span class="box">' + (sel ? '✓' : '') + '</span>' +
              '<span class="d">' + WD[day.idx] + '<small>' + day.m + '/' + day.d + '</small></span><span class="vals">';
      if (!info.usable) {
        h += '<span class="pill">' + esc(info.note) + '</span>';
      } else if (nv !== undefined && S.tai) {
        h += (info.cur ? '<span class="pill">' + esc(info.cur) + '</span><span class="arrow">＋</span>' : '') + '<span class="pill new">' + esc(nv) + '</span>';
      } else if (nv !== undefined && info.cur !== (nv === null ? '' : nv)) {
        h += '<span class="pill was' + (info.cur ? '' : ' empty') + '">' + (info.cur ? esc(info.cur) : '—') + '</span>' +
             '<span class="arrow">→</span><span class="pill new">' + (nv === null ? '空' : esc(nv)) + '</span>';
      } else {
        h += '<span class="pill' + (info.cur ? '' : ' empty') + '">' + (info.cur ? esc(info.cur) : '—') + '</span>';
      }
      d.innerHTML = h + '</span>';
      if (info.usable) d.onclick = function () { S.sel[day.idx] = S.sel[day.idx] ? 0 : 1; render(); };
      box.appendChild(d);
    });
  }

  // 体入を消すモード：その日の体入を1件ずつ、タップで選ぶ（日の欄をタップすると、その日の分をまとめて選ぶ）
  function delRow(day, info) {
    var d = document.createElement('div');
    var any = info.entries.some(function (e) { return S.taiDel[day.idx + ':' + e.row]; });
    d.className = 'day' + (any ? ' sel' : '') + (day.past ? ' past' : '');
    d.innerHTML = '<span class="box">' + (any ? '✓' : '') + '</span><span class="d">' + WD[day.idx] + '<small>' + day.m + '/' + day.d + '</small></span>' +
      '<span class="vals ents">' + (info.entries.length
        ? info.entries.map(function (e) { return '<span class="pill ent' + (S.taiDel[day.idx + ':' + e.row] ? ' del' : '') + '" data-row="' + e.row + '">' + esc(e.v) + '</span>'; }).join('')
        : '<span class="pill empty">—</span>') + '</span>';
    d.onclick = function (ev) {
      var t = ev.target.closest ? ev.target.closest('.ent') : null;
      if (t) { var k = day.idx + ':' + t.getAttribute('data-row'); if (S.taiDel[k]) delete S.taiDel[k]; else S.taiDel[k] = 1; }
      else {
        var all = info.entries.length && info.entries.every(function (e) { return S.taiDel[day.idx + ':' + e.row]; });
        info.entries.forEach(function (e) { var k = day.idx + ':' + e.row; if (all) delete S.taiDel[k]; else S.taiDel[k] = 1; });
      }
      render();
    };
    return d;
  }

  function renderPreview() {
    var p = plan(), pv = $('preview'), sv = $('save');
    var who = S.tai ? '体入' : (S.person || '');
    function say(h) { pv.innerHTML = '<div>' + h + '</div>'; }
    sv.disabled = true; sv.textContent = '保存'; sv.className = 'save';
    if (S.saving) { say('保存しています …'); sv.textContent = '保存しています'; return; }
    if (p.del) {
      if (!p.count) { say('消す体入を、タップして選んでください（日の欄で、その日の分を全部）'); return; }
      say('<b>体入</b> の ' + p.count + '件を <b>空（クリア）</b>にします<br><span class="ow">入力済みの ' + p.count + '件が消えます</span>');
      sv.disabled = false; sv.textContent = p.count + '件を消す'; sv.className = 'save danger';
      return;
    }
    if (p.problem) { say('<span class="bad">' + esc(p.problem) + '</span>'); return; }
    if (!p.count) {
      say(selDays().length ? (S.tai ? '入りを選んでください' : '入りか上がりを選んでください') : '日付を選んで、入り・上がりを選びます');
      return;
    }
    var nvs = {}; Object.keys(p.groups).forEach(function (k) { p.groups[k].cells.forEach(function (c) { nvs[c.value === null ? '空' : c.value] = 1; }); });
    var vs = Object.keys(nvs);
    var clr = vs.length === 1 && vs[0] === '空', multi = vs.length > 1;
    var l2 = [];
    if (multi) l2.push('日ごとの値');
    if (p.ow) l2.push(clr ? '入力済みの ' + p.ow + '日分が消えます' : 'うち ' + p.ow + '日は上書き');
    say('<b>' + esc(who) + '</b> の <b>' + p.count + '日分</b>を' + (clr ? ' <b>空（クリア）</b>に' : (multi ? '書き込み' : '<b>「' + esc(vs[0]) + '」</b>で書き込み')) +
      (l2.length ? '<br><span class="ow">' + l2.join(' ・ ') + '</span>' : ''));
    sv.disabled = false; sv.textContent = p.count + '日分を保存';
  }

  // ---- 保存 -----------------------------------------------------------------
  function applyUpdate(key, updated) {
    var mo = S.months[key];
    updated.forEach(function (u) {
      mo.cells[u.row] = mo.cells[u.row] || {};
      if (u.display) mo.cells[u.row][u.day] = u.display; else delete mo.cells[u.row][u.day];
    });
  }

  function errText(r) {
    switch (r && r.error) {
      case 'nosheet': return 'シートが見つかりません';
      case 'rowchanged': return '名前の位置が変わっています。更新してください';
      case 'badday': case 'badrow': return 'シートの形が変わっています。更新してください';
      case 'badvalue': return 'この値は書き込めません';
      case 'server': return 'サーバーでエラーが起きました';
      default: return '保存できませんでした';
    }
  }

  // 下書きのある日すべてを、シートごとに1回で保存する。保存できたシートの日だけ、下書きと選択を消す
  function doSave(force) {
    var p = plan();
    if (S.saving || !p.count || p.problem) return;
    S.saving = true; render();
    var chain = Promise.resolve({ ok: true });
    Object.keys(p.groups).forEach(function (k) {
      var g = p.groups[k]; if (!g.cells.length) return;
      chain = chain.then(function (prev) {
        if (!prev.ok) return prev;
        return api({ api: 'save', token: S.token, sheet: k, name: S.tai ? null : S.person, cells: g.cells, force: !!force })
          .then(function (r) {
            r.key = k;
            if (r.ok) {
              applyUpdate(k, r.updated);
              g.idxs.forEach(function (i) { delete S.draft[i]; delete S.sel[i]; });
              g.dels.forEach(function (x) { delete S.taiDel[x]; });
            }
            return r;
          });
      });
    });
    chain.then(function (r) {
      S.saving = false;
      if (r.ok) { S.lastSync = Date.now(); toast('保存しました'); }
      else if (r.error === 'auth') { logout('ログインの期限が切れました。もう一度ログインしてください'); return; }
      else if (r.error === 'conflict') showConflict(r);
      else toast(errText(r));
      render();
    }).catch(function () {
      S.saving = false; toast('通信に失敗しました。もう一度お試しください'); render();
    });
  }

  // ---- ダイアログ -------------------------------------------------------------------
  function closeDlg() { $('dlgRoot').innerHTML = ''; }
  function openDlg(html, wire) {
    $('dlgRoot').innerHTML = '<div class="veil" id="veil"></div><div class="sheet">' + html + '</div>';
    $('veil').onclick = closeDlg;
    wire();
  }
  function showConflict(r) {
    var items = r.conflicts.map(function (c) {
      return '<li>' + c.day + '日：<s>' + esc(c.expect || '空') + '</s> → 今は <b>' + esc(c.current || '空') + '</b></li>';
    }).join('');
    openDlg('<h2>シートが変更されています</h2><p>画面を開いてから、シートが直接書き換えられました。そのまま保存すると、上書きされます。</p><ul>' + items + '</ul>' +
      '<div class="btns"><button class="main" id="dReload">最新の状態を読み込む</button><button class="danger" id="dForce">このまま上書きする</button><button id="dCancel">やめる</button></div>', function () {
      $('dCancel').onclick = closeDlg;
      $('dReload').onclick = function () { closeDlg(); loadMonth(r.key, true).then(render); };
      $('dForce').onclick = function () { closeDlg(); doSave(true); };
    });
  }
  function showMenu() {
    var t = S.lastSync ? new Date(S.lastSync).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : '—';
    openDlg('<h2>メニュー</h2><p>最後に読み込んだ時刻：' + t + '</p>' +
      '<div class="btns"><button class="main" id="mReload">最新の状態に更新</button><button class="danger" id="mLogout">ログアウト（合言葉を消す）</button><button id="mClose">閉じる</button></div>', function () {
      $('mClose').onclick = closeDlg;
      $('mReload').onclick = function () { closeDlg(); toast('更新しています …'); refreshAll(); };
      $('mLogout').onclick = function () { closeDlg(); logout(''); };
    });
  }

  // ---- ログイン・ログアウト ---------------------------------------------------------
  function showLogin(msg) {
    $('appView').hidden = true; $('loginView').hidden = false;
    $('loginMsg').textContent = msg || '';
    setTimeout(function () { $('pin').focus(); }, 50);
  }
  function logout(msg) {
    store.del(TOKEN_KEY); S.token = null; S.months = {}; S.sel = {}; S.draft = {}; S.taiDel = {}; S.delMode = false; S.person = null;
    closeDlg(); showLogin(msg);
  }
  function doLogin() {
    var pin = $('pin').value.trim(); if (!pin) return;
    var btn = $('loginBtn'); btn.disabled = true; $('loginMsg').textContent = '';
    api({ api: 'login', pin: pin }).then(function (r) {
      btn.disabled = false;
      if (r.ok) { store.set(TOKEN_KEY, r.token); S.token = r.token; $('pin').value = ''; start(); }
      else if (r.error === 'locked') $('loginMsg').textContent = '間違いが続いたため、しばらく入力できません（約10分）';
      else if (r.error === 'wrong') $('loginMsg').textContent = 'PINが違います。あと ' + r.remaining + ' 回で、しばらく入力できなくなります';
      else if (r.error === 'setup') $('loginMsg').textContent = 'サーバーの設定が済んでいません';
      else $('loginMsg').textContent = 'ログインできませんでした';
    }).catch(function () { btn.disabled = false; $('loginMsg').textContent = '通信に失敗しました。もう一度お試しください'; });
  }

  // ---- 開始 -----------------------------------------------------------------
  function start() {
    $('loginView').hidden = true; $('appView').hidden = false;
    S.today = businessToday(); S.week = 1; resetInput();
    render();
    loadWeek(1).then(function () {
      // 来週のシートがまだ無い（月末など）ときは、今週を開く
      var ok = weekDays(1).some(function (d) { var mo = S.months[d.key]; return mo && mo.status === 'ok'; });
      if (!ok) { S.week = 0; return loadWeek(0); }
    }).then(render);
  }

  function resetInput() { S.sel = {}; S.draft = {}; S.taiDel = {}; S.delMode = false; }

  // 未保存の下書きがあれば、確認してから切り替える
  function guard(go) {
    if (!hasUnsaved()) { go(); return; }
    openDlg('<h2>未保存の下書きがあります</h2><p>切り替えると、下書きは消えます。</p>' +
      '<div class="btns"><button class="main" id="dBack">戻る</button><button class="danger" id="dDiscard">破棄して切り替える</button></div>', function () {
      $('dBack').onclick = closeDlg;
      $('dDiscard').onclick = function () { closeDlg(); go(); };
    });
  }

  function openPicker() { renderPicker(); $('picker').classList.add('open'); $('pveil').classList.add('open'); }
  function closePicker() { $('picker').classList.remove('open'); $('pveil').classList.remove('open'); }

  function wire() {
    $('loginBtn').onclick = doLogin;
    $('pin').onkeydown = function (e) { if (e.key === 'Enter') doLogin(); };
    $('menuBtn').onclick = showMenu;
    $('pchange').onclick = openPicker;
    $('pveil').onclick = closePicker;
    $('seg').onclick = function (e) {
      var w = e.target.getAttribute('data-w'); if (w === null || Number(w) === S.week) return;
      guard(function () { S.week = Number(w); S.sel = {}; S.draft = {}; S.taiDel = {}; render(); loadWeek(S.week); });
    };
    $('clear').onclick = function () { S.delMode = !S.delMode; S.taiDel = {}; S.sel = {}; render(); };
    $('retai').onchange = function () {
      var on = this.checked;
      apply(function (d) { d.retai = on; });
    };
    $('save').onclick = function () { doSave(false); };
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { S.hiddenAt = Date.now(); return; }
      if (S.token && S.hiddenAt && Date.now() - S.hiddenAt > 120000) refreshAll();
    });
  }

  function renderPicker() {
    var g = $('pgrid'); g.innerHTML = '';
    peopleList().forEach(function (name) {
      var b = document.createElement('button'); b.textContent = name;
      if (!S.tai && S.person === name) b.className = 'on';
      b.onclick = function () {
        closePicker();
        if (!S.tai && S.person === name) return;
        guard(function () { S.person = name; S.tai = false; store.set(PERSON_KEY, name); resetInput(); render(); });
      };
      g.appendChild(b);
    });
    var t = document.createElement('button'); t.className = 'tai' + (S.tai ? ' on' : ''); t.textContent = '体入（名前なし）';
    t.onclick = function () {
      closePicker();
      if (S.tai) return;
      guard(function () { S.tai = true; resetInput(); render(); });
    };
    g.appendChild(t);
  }

  function init() {
    wire();
    if (MOCK && !qs.has('login')) { S.token = 'mock'; start(); return; }   // 開発用：?mock&login でログイン画面も試せる
    S.token = store.get(TOKEN_KEY);
    if (S.token) start(); else showLogin('');
  }

  // 開発用：外から状態を見る（本番では使わない）
  window.__shift = { S: S, plan: plan, weekDays: weekDays, dayInfo: dayInfo };

  if (MOCK) {
    var s = document.createElement('script');
    s.src = '../dev/mock-api.js';
    s.onload = init; s.onerror = function () { document.body.textContent = 'dev/mock-api.js が見つかりません'; };
    document.head.appendChild(s);
  } else {
    init();
  }
})();
</script>
</body>
</html>
